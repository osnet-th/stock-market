                                    <label class="block text-sm font-medium text-gray-700 mb-1">매도 수량</label>
                                    <input type="number" x-model="portfolio.editSaleForm.quantity" min="1"
                                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">판매 단가</label>
                                    <input type="number" x-model="portfolio.editSaleForm.salePrice" step="0.01" min="0.01"
                                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">매도 사유</label>
                                    <select x-model="portfolio.editSaleForm.reason"
                                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                                        <option value="TARGET_PRICE_REACHED">목표가 도달</option>
                                        <option value="STOP_LOSS">손절</option>
                                        <option value="CASH_NEEDED">현금 확보</option>
                                        <option value="REBALANCING">리밸런싱</option>
                                        <option value="OTHER">기타</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">메모</label>
                                    <input type="text" x-model="portfolio.editSaleForm.memo" maxlength="200"
                                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                                </div>
                                <p class="text-xs text-amber-600">
                                    수정 시 보유 수량과 원화 잔액이 자동 재계산됩니다. 환율과 매도 시점 자산은 그대로 유지됩니다.
                                </p>
                            </div>
                        </template>

                        <div class="flex justify-end gap-2 mt-6">
                            <template x-if="!portfolio.editingSaleHistory">
                                <div class="flex gap-2">
                                    <button @click="confirmDeleteSale()"
                                        class="px-4 py-2 text-sm text-red-600 hover:text-red-800 transition">삭제</button>
                                    <button @click="startEditSaleHistory()"
                                        class="px-4 py-2 text-sm text-blue-600 hover:text-blue-800 transition">수정</button>
                                    <button @click="closeSaleDetailModal()"
                                        class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">닫기</button>
                                </div>
                            </template>
                            <template x-if="portfolio.editingSaleHistory">
                                <div class="flex gap-2">
                                    <button @click="cancelEditSaleHistory()"
                                        class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">취소</button>
                                    <button @click="submitSaleEdit()"
                                        class="bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-rose-700 transition">저장</button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
