<!-- ========== GLOSSARY (개인 용어 사전) ========== -->
<div x-show="currentPage === 'glossary'" x-cloak
     x-init="$watch('currentPage', v => { if (v === 'glossary') glossaryLoad(); }); if (currentPage === 'glossary') glossaryLoad();">

    <!-- 헤더 -->
    <div class="flex items-center justify-between mb-4">
        <div>
            <h2 class="text-xl font-bold text-gray-800">용어 사전</h2>
            <p class="text-xs text-gray-500 mt-1">모르는 경제·주식 용어를 등록해 두고 카테고리로 묶어 다시 찾아보세요.</p>
        </div>
        <button type="button" @click="glossaryOpenCreate()"
                class="inline-flex items-center gap-1 px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
            용어 등록
        </button>
    </div>

    <div class="flex flex-col gap-4 lg:flex-row">
        <!-- 좌측: 카테고리 사이드바 -->
        <aside class="lg:w-56 shrink-0 bg-white border border-gray-200 rounded p-3">
            <div class="text-xs font-medium text-gray-500 mb-2">카테고리</div>
            <ul class="space-y-1">
                <li>
                    <button type="button" @click="glossarySelectCategoryFilter(null)"
                            class="w-full text-left text-sm px-2 py-1.5 rounded"
                            :class="glossary.activeCategoryFilter === null
                                    ? 'bg-blue-50 text-blue-700 font-medium'
                                    : 'text-gray-700 hover:bg-gray-50'">
                        전체
                    </button>
                </li>
                <li>
                    <button type="button" @click="glossarySelectCategoryFilter('uncategorized')"
                            class="w-full text-left text-sm px-2 py-1.5 rounded"
                            :class="glossary.activeCategoryFilter === 'uncategorized'
                                    ? 'bg-blue-50 text-blue-700 font-medium'
                                    : 'text-gray-700 hover:bg-gray-50'">
                        미분류
                    </button>
                </li>
                <template x-for="cat in glossary.categories" :key="cat.id">
                    <li class="group">
                        <template x-if="glossary.categoryEditId !== cat.id">
                            <div class="flex items-center gap-1">
                                <button type="button" @click="glossarySelectCategoryFilter(cat.id)"
                                        class="flex-1 text-left text-sm px-2 py-1.5 rounded truncate"
                                        :class="glossary.activeCategoryFilter === cat.id
                                                ? 'bg-blue-50 text-blue-700 font-medium'
                                                : 'text-gray-700 hover:bg-gray-50'"
                                        x-text="cat.name"></button>
                                <button type="button" @click="glossaryStartRenameCategory(cat)"
                                        class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-gray-700 transition px-1"
                                        title="이름 변경">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                                </button>
                                <button type="button" @click="glossaryRequestDeleteCategory(cat)"
                                        class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-rose-600 transition px-1"
                                        title="삭제">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3" /></svg>
                                </button>
                            </div>
                        </template>
                        <template x-if="glossary.categoryEditId === cat.id">
                            <div class="space-y-1">
                                <input type="text" x-model="glossary.categoryEditName"
                                       @keyup.enter="glossarySaveRenameCategory()"
                                       @keyup.escape="glossaryCancelRenameCategory()"
                                       maxlength="50"
                                       class="w-full text-sm px-2 py-1.5 border border-blue-400 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                                <div class="flex gap-1">
                                    <button type="button" @click="glossarySaveRenameCategory()"
                                            class="flex-1 text-xs px-2 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">저장</button>
                                    <button type="button" @click="glossaryCancelRenameCategory()"
                                            class="flex-1 text-xs px-2 py-1 border border-gray-300 rounded hover:bg-gray-50">취소</button>
                                </div>
                                <p x-show="glossary.categoryEditError" class="text-xs text-rose-600" x-text="glossary.categoryEditError"></p>
                            </div>
                        </template>
                    </li>
                </template>
            </ul>

            <!-- 신규 카테고리 입력 -->
            <div class="mt-3 pt-3 border-t border-gray-100 space-y-1">
                <input type="text" x-model="glossary.newCategoryName"
                       @keyup.enter="glossaryAddCategory()"
                       placeholder="새 카테고리"
                       maxlength="50"
                       class="w-full text-xs px-2 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                <p x-show="glossary.newCategoryError" class="text-xs text-rose-600" x-text="glossary.newCategoryError"></p>
            </div>
        </aside>

        <!-- 우측: 검색 + 정렬 + 목록 -->
        <section class="flex-1 min-w-0">
            <!-- 검색바 + 정렬 -->
            <div class="bg-white border border-gray-200 rounded p-3 mb-3 flex flex-wrap items-end gap-3">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs text-gray-500 mb-1">용어명</label>
                    <input type="text" x-model="glossary.filter.q"
                           @input="glossaryApplyQuery()"
                           placeholder="용어 검색"
                           maxlength="100"
                           class="w-full text-sm border border-gray-300 rounded px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs text-gray-500 mb-1">설명</label>
                    <input type="text" x-model="glossary.filter.definitionQ"
                           @input="glossaryApplyQuery()"
                           placeholder="설명 검색"
                           maxlength="100"
                           class="w-full text-sm border border-gray-300 rounded px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">정렬</label>
                    <select x-model="glossary.sort"
                            @change="glossaryChangeSort(glossary.sort)"
                            class="text-sm border border-gray-300 rounded px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="REGISTERED_DESC">최신순</option>
                        <option value="REGISTERED_ASC">오래된순</option>
                        <option value="ALPHA_ASC">가나다순</option>
                    </select>
                </div>
            </div>

            <!-- 상태 메시지 -->
            <div x-show="glossary.loading" class="text-sm text-gray-400 mb-2">로딩 중…</div>
            <div x-show="glossary.error" class="text-sm text-rose-600 mb-2" x-text="glossary.error"></div>

            <!-- Empty state -->
            <template x-if="!glossary.loading && glossary.terms.length === 0 && !glossary.error && !glossary.filter.q && !glossary.filter.definitionQ && glossary.activeCategoryFilter === null">
                <div class="bg-white border border-dashed border-gray-300 rounded p-8 text-center text-sm text-gray-500">
                    <p class="mb-3">첫 용어를 등록해보세요. 모르는 경제·주식 용어를 정리해두면 나중에 카테고리로 묶어 찾아볼 수 있어요.</p>
                    <button type="button" @click="glossaryOpenCreate()"
                            class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700">
                        용어 등록
                    </button>
                </div>
            </template>

            <template x-if="!glossary.loading && glossary.terms.length === 0 && !glossary.error && (glossary.filter.q || glossary.filter.definitionQ)">
                <div class="bg-white border border-dashed border-gray-300 rounded p-8 text-center text-sm text-gray-500">
                    검색 결과가 없습니다.
                </div>
            </template>

            <template x-if="!glossary.loading && glossary.terms.length === 0 && !glossary.error && !glossary.filter.q && !glossary.filter.definitionQ && glossary.activeCategoryFilter !== null">
                <div class="bg-white border border-dashed border-gray-300 rounded p-8 text-center text-sm text-gray-500">
                    이 카테고리에 등록된 용어가 없습니다.
                </div>
            </template>

            <!-- 용어 카드 리스트 -->
            <ul x-show="glossary.terms.length > 0" class="space-y-2">
                <template x-for="term in glossary.terms" :key="term.id">
                    <li class="bg-white border border-gray-200 rounded p-3 hover:border-blue-300 transition">
                        <div class="flex items-start justify-between gap-2 mb-1">
                            <h3 class="text-sm font-semibold text-gray-800 truncate" x-text="term.name"></h3>
                            <div class="flex items-center gap-1 shrink-0">
                                <button type="button" @click="glossaryOpenEdit(term)"
                                        class="text-xs text-gray-500 hover:text-blue-600 px-2 py-0.5">수정</button>
                                <button type="button" @click="glossaryDeleteTerm(term.id)"
                                        class="text-xs text-gray-500 hover:text-rose-600 px-2 py-0.5">삭제</button>
                            </div>
                        </div>
                        <p class="text-xs text-gray-600 whitespace-pre-wrap break-words" x-text="term.definition || '(설명 없음)'"></p>
                        <div class="flex items-center gap-2 mt-2 text-[11px] text-gray-400">
                            <span class="inline-flex items-center px-1.5 py-0.5 rounded bg-gray-100 text-gray-600"
                                  x-text="glossaryCategoryName(term.categoryId)"></span>
                            <span x-text="(term.createdAt || '').slice(0, 10)"></span>
                        </div>
                    </li>
                </template>
            </ul>

            <!-- 페이지네이션 -->
            <div x-show="glossary.terms.length > 0" class="flex items-center justify-between mt-4 text-xs text-gray-500">
                <span>
                    <span x-text="(glossary.pagination.page * glossary.pagination.size) + 1"></span>-<span
                          x-text="Math.min((glossary.pagination.page + 1) * glossary.pagination.size, glossary.pagination.totalCount)"></span>
                    /
                    <span x-text="glossary.pagination.totalCount"></span>건
                </span>
                <div class="flex items-center gap-2">
                    <button type="button" @click="glossaryChangePage(-1)"
                            :disabled="glossary.pagination.page === 0"
                            class="px-2 py-1 border border-gray-300 rounded disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-50">이전</button>
                    <span>
                        <span x-text="glossary.pagination.page + 1"></span> / <span x-text="glossaryTotalPages()"></span>
                    </span>
                    <button type="button" @click="glossaryChangePage(1)"
                            :disabled="glossary.pagination.page + 1 >= glossaryTotalPages()"
                            class="px-2 py-1 border border-gray-300 rounded disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-50">다음</button>
                </div>
            </div>
        </section>
    </div>

    <!-- 용어 등록/수정 모달 (slideover) -->
    <div x-show="glossary.mode" x-cloak class="fixed inset-0 z-50 flex">
        <div class="absolute inset-0 bg-black/40" @click="glossaryCloseModal()"></div>
        <div class="relative ml-auto h-full w-full max-w-md bg-white shadow-xl overflow-y-auto">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-base font-semibold text-gray-800"
                    x-text="glossary.mode === 'edit' ? '용어 수정' : '용어 등록'"></h3>
                <button type="button" @click="glossaryCloseModal()" class="text-gray-400 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>

            <div class="p-4 space-y-3">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">용어명 <span class="text-rose-500">*</span></label>
                    <input type="text" x-model="glossary.form.name" maxlength="200"
                           placeholder="예: PER, 영업이익률"
                           class="w-full text-sm border border-gray-300 rounded px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs text-gray-600 mb-1">설명</label>
                    <textarea x-model="glossary.form.definition" maxlength="4000" rows="6"
                              placeholder="용어의 의미를 자유롭게 적어보세요."
                              class="w-full text-sm border border-gray-300 rounded px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs text-gray-600 mb-1">카테고리</label>
                    <select x-model.number="glossary.form.categoryId"
                            class="w-full text-sm border border-gray-300 rounded px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option :value="null">미분류</option>
                        <template x-for="cat in glossary.categories" :key="cat.id">
                            <option :value="cat.id" x-text="cat.name"></option>
                        </template>
                    </select>
                    <div class="mt-2">
                        <label class="block text-[11px] text-gray-500 mb-1">또는 새 카테고리로 분류</label>
                        <input type="text" x-model="glossary.form.categoryName"
                               maxlength="50"
                               placeholder="새 카테고리명 (선택)"
                               class="w-full text-sm border border-gray-200 rounded px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <p class="text-[11px] text-gray-400 mt-1">새 카테고리명을 입력하면 이름 일치 카테고리에 자동 연결되거나 새로 생성됩니다.</p>
                    </div>
                </div>

                <p x-show="glossary.formError" class="text-xs text-rose-600" x-text="glossary.formError"></p>
            </div>

            <div class="p-4 border-t border-gray-200 flex items-center justify-end gap-2">
                <button type="button" @click="glossaryCloseModal()"
                        class="px-3 py-1.5 text-sm border border-gray-300 rounded hover:bg-gray-50">취소</button>
                <button type="button" @click="glossarySave()"
                        class="px-3 py-1.5 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700">저장</button>
            </div>
        </div>
    </div>

    <!-- 카테고리 삭제 확인 다이얼로그 (R6) -->
    <div x-show="glossary.deleteImpact" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/40" @click="glossaryCancelDeleteCategory()"></div>
        <div class="relative bg-white rounded-lg shadow-xl max-w-sm w-full p-5">
            <h3 class="text-base font-semibold text-gray-800 mb-2">카테고리 삭제</h3>
            <template x-if="glossary.deleteImpact && glossary.deleteImpact.count > 0">
                <p class="text-sm text-gray-600 mb-4">
                    "<span x-text="glossary.deleteImpact.name"></span>" 카테고리를 삭제하면
                    속한 용어 <span class="font-medium" x-text="glossary.deleteImpact.count"></span>개가
                    "미분류"로 이동합니다. 계속할까요?
                </p>
            </template>
            <template x-if="glossary.deleteImpact && glossary.deleteImpact.count === 0">
                <p class="text-sm text-gray-600 mb-4">
                    "<span x-text="glossary.deleteImpact.name"></span>" 카테고리를 삭제할까요?
                </p>
            </template>
            <div class="flex items-center justify-end gap-2">
                <button type="button" @click="glossaryCancelDeleteCategory()"
                        class="px-3 py-1.5 text-sm border border-gray-300 rounded hover:bg-gray-50">취소</button>
                <button type="button" @click="glossaryConfirmDeleteCategory()"
                        class="px-3 py-1.5 text-sm font-medium text-white bg-rose-600 rounded hover:bg-rose-700">삭제</button>
            </div>
        </div>
    </div>
</div>
