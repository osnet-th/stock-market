            <!-- ========== SALARY USAGE RATIO ========== -->
            <div x-show="currentPage === 'salary'" x-cloak>
                <h2 class="text-xl font-bold text-gray-800 mb-6">월급 사용 비율</h2>

                <!-- 월 선택 바 -->
                <div class="flex flex-wrap items-center gap-2 mb-6">
                    <button @click="goPrevSalaryMonth()"
                            :disabled="!salary.currentMonth"
                            class="p-2 rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40"
                            title="이전 월">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>

                    <select :value="salary.currentMonth"
                            @change="onSalaryMonthSelected($event.target.value)"
                            class="px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white min-w-[120px] sm:min-w-[140px]">
                        <template x-if="!salary.availableMonths.length">
                            <option :value="salary.currentMonth" x-text="salary.currentMonth || '선택'"></option>
                        </template>
                        <template x-for="m in salary.availableMonths" :key="m">
                            <option :value="m" :selected="m === salary.currentMonth" x-text="m"></option>
                        </template>
                    </select>

                    <button @click="goNextSalaryMonth()"
                            class="p-2 rounded-lg border border-gray-200 hover:bg-gray-50"
                            title="다음 월">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>

                    <button @click="openSalaryNewMonthDialog()"
                            class="ml-2 px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
                        + 새 월 기록
                    </button>

                    <div class="ml-auto text-sm text-gray-400" x-show="salary.loading">로딩 중…</div>
                </div>

                <!-- 초기 로딩 전 placeholder -->
                <template x-if="!salary.monthlyView">
                    <div class="text-center py-10 text-gray-400 text-sm">데이터를 불러오는 중…</div>
                </template>

                <!-- 월별 뷰 로드 후: 입력 섹션은 항상 표시, 요약/차트/추이는 데이터 있을 때만 -->
                <template x-if="salary.monthlyView">
                    <div>
                        <!-- 요약 배너 (데이터 있을 때만) -->
                        <template x-if="salaryHasAnyData()">
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                                <div class="bg-white rounded-xl border border-gray-200 p-4">
                                    <p class="text-xs text-gray-500">월급 (실수령)</p>
                                    <p class="text-xl font-bold text-gray-800 mt-1"
                                       x-text="salary.monthlyView.income != null ? formatKrw(salary.monthlyView.income) : '미입력'"></p>
                                    <p class="text-xs text-gray-400 mt-1"
                                       x-show="salary.monthlyView.incomeInheritedFromMonth"
                                       x-text="'상속 출처: ' + salary.monthlyView.incomeInheritedFromMonth"></p>
                                </div>
                                <div class="bg-white rounded-xl border border-gray-200 p-4">
                                    <p class="text-xs text-gray-500">잔여 / 초과</p>
                                    <p class="text-xl font-bold mt-1"
                                       :class="salaryIsOverspending() ? 'text-red-600' : 'text-emerald-600'"
                                       x-text="salaryRemainingDisplay()"></p>
                                    <p class="text-xs text-red-600 mt-1"
                                       x-show="salaryIsOverspending()"
                                       x-text="'초과 ' + formatKrw(salaryOverspendingAmount())"></p>
                                </div>
                                <div class="bg-white rounded-xl border border-gray-200 p-4">
                                    <p class="text-xs text-gray-500">저축율</p>
                                    <p class="text-xl font-bold mt-1"
                                       :class="salaryIsNegativeRatio() ? 'text-red-600' : 'text-indigo-600'"
                                       x-text="salaryRatioDisplay()"></p>
                                    <p class="text-xs text-gray-400 mt-1">= 저축·투자 / 월급</p>
                                </div>
                            </div>
                        </template>

                        <!-- 온보딩 안내 (데이터 없을 때) -->
                        <template x-if="!salaryHasAnyData()">
                            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-4">
                                <p class="text-sm text-indigo-800 font-medium">월 실수령액을 먼저 입력해주세요.</p>
                                <p class="text-xs text-indigo-600 mt-1">
                                    월급을 저장하면 카테고리별 지출 입력 · 도넛/바/추이 차트가 활성화됩니다.
                                </p>
                            </div>
                        </template>

                        <!-- 입력 섹션 (항상 표시) -->
                        <div class="bg-white rounded-xl border border-gray-200 p-4 space-y-3 mb-4">
                            <h3 class="text-sm font-semibold text-gray-700">입력</h3>

                            <!-- 월급 -->
                            <div class="flex flex-wrap items-center gap-2 sm:flex-nowrap">
                                <label class="w-full sm:w-24 text-sm text-gray-600 shrink-0">월 실수령액</label>
                                <input x-ref="salaryIncomeInput"
                                       type="number" min="0" step="1"
                                       x-model="salary.editingIncome"
                                       placeholder="예: 3000000"
                                       class="flex-1 min-w-0 px-3 py-2 border border-gray-200 rounded-lg text-sm"/>
                                <button @click="saveSalaryIncome()"
                                        class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700 shrink-0">저장</button>
                                <button @click="deleteSalaryIncomeRecord()"
                                        x-show="hasSalaryDirectIncomeRecord()"
                                        class="px-2 py-2 rounded-lg border border-red-200 text-red-600 text-sm hover:bg-red-50 shrink-0"
                                        title="이번 월의 변경 레코드 삭제">×</button>
                            </div>

                            <!-- 카테고리 입력 -->
                            <template x-for="cat in SALARY_CATEGORIES" :key="cat.key">
                                <div class="flex flex-wrap items-center gap-2 sm:flex-nowrap">
                                    <label class="w-full sm:w-24 text-sm text-gray-600 flex items-center gap-1 shrink-0">
                                        <span class="inline-block w-2 h-2 rounded-full shrink-0"
                                              :style="{ backgroundColor: cat.color }"></span>
                                        <span x-text="cat.label"></span>
                                    </label>
                                    <input type="number" min="0" step="1"
                                           x-model="salary.editingSpending[cat.key].amount"
                                           class="w-28 px-2 py-2 border border-gray-200 rounded-lg text-sm shrink-0"/>
                                    <input type="text" placeholder="메모 (선택)"
                                           x-model="salary.editingSpending[cat.key].memo"
                                           maxlength="200"
                                           class="flex-1 min-w-0 px-2 py-2 border border-gray-200 rounded-lg text-sm"/>
                                    <button @click="saveSalarySpending(cat.key)"
                                            class="px-2 py-2 rounded-lg bg-indigo-600 text-white text-xs hover:bg-indigo-700 shrink-0">저장</button>
                                    <button @click="deleteSalarySpendingRecord(cat.key)"
                                            x-show="hasSalaryDirectSpendingRecord(cat.key)"
                                            class="px-2 py-2 rounded-lg border border-red-200 text-red-600 text-xs hover:bg-red-50 shrink-0"
                                            title="이번 월의 변경 레코드 삭제">×</button>
                                </div>
                            </template>
                        </div>

                        <!-- 차트 섹션 (데이터 있을 때만) -->
                        <template x-if="salaryHasAnyData()">
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
                                <div class="bg-white rounded-xl border border-gray-200 p-4">
                                    <h3 class="text-sm font-semibold text-gray-700 mb-3">월별 분포</h3>
                                    <div class="relative h-48 sm:h-64">
                                        <canvas x-ref="salaryDonutCanvas"
                                                role="img"
                                                aria-label="월별 카테고리 비율 도넛 차트"></canvas>
                                    </div>
                                </div>
                                <div class="bg-white rounded-xl border border-gray-200 p-4">
                                    <h3 class="text-sm font-semibold text-gray-700 mb-3">카테고리별 금액</h3>
                                    <div class="relative h-48 sm:h-64">
                                        <canvas x-ref="salaryBarCanvas"
                                                role="img"
                                                aria-label="월별 카테고리 금액 바 차트"></canvas>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- 추이 라인 차트 (데이터 있을 때만) -->
                        <template x-if="salaryHasAnyData()">
                            <div class="bg-white rounded-xl border border-gray-200 p-4">
                                <h3 class="text-sm font-semibold text-gray-700 mb-3">최근 12개월 추이</h3>
                                <div class="relative h-56 sm:h-80">
                                    <canvas x-ref="salaryLineCanvas"
                                            role="img"
                                            aria-label="최근 12개월 월급/총지출/저축율 추이 라인 차트"></canvas>
                                </div>
                                <template x-if="!salary.trend || !salary.trend.points || !salary.trend.points.length">
                                    <p class="text-center text-sm text-gray-400 py-8">기록된 데이터가 없습니다.</p>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- 새 월 기록 다이얼로그 -->
                <div x-show="salary.showNewMonthDialog" x-cloak
                     class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center"
                     @click.self="closeSalaryNewMonthDialog()">
                    <div class="bg-white rounded-xl p-6 w-full max-w-sm">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">새 월 기록</h3>
                        <p class="text-sm text-gray-500 mb-3">
                            변경을 기록할 월을 선택하세요. 미래 월은 선택할 수 없습니다.
                        </p>
                        <input type="month" x-model="salary.newMonthInput"
                               :max="currentYearMonthString()"
                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm mb-4"/>
                        <div class="flex justify-end gap-2">
                            <button @click="closeSalaryNewMonthDialog()"
                                    class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">취소</button>
                            <button @click="confirmSalaryNewMonth()"
                                    class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">확인</button>
                        </div>
                    </div>
                </div>
            </div>
