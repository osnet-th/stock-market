# Application - 공통 설정
spring:
  application:
    name: stock-market

  # 기본 프로파일
  profiles:
    active: dev

  # Static Resources - 새로고침 즉시 반영
  web:
    resources:
      cache:
        period: 0
      static-locations: file:src/main/resources/static/

  # JPA/Hibernate 공통 설정
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        jdbc:
          batch_size: 1000

  # Jackson: Spring Boot 4 + Jackson 3의 기본 동작으로 충분하므로 별도 설정 없음.
  # - YearMonth는 JavaTimeModule 기본 등록으로 "2026-04" ISO 문자열로 직렬화됨
  # - BigDecimal은 기본적으로 toPlainString 사용 (과학적 표기 회피)
  # (Jackson 3에서 SerializationFeature.WRITE_DATES_AS_TIMESTAMPS가 이동/제거되어
  #  spring.jackson.serialization 하위 속성으로 바인딩 실패)

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 5s

  # Scheduler Configuration
  task:
    scheduling:
      pool:
        size: 5

  # Mail Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: 8080

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT Configuration (운영 환경에서는 환경 변수로 오버라이드)
jwt:
  secret: your-256-bit-secret-key-change-in-production-minimum-32-characters
  access-token-expiration: 86400000    # 1일 (밀리초)
  refresh-token-expiration: 604800000  # 7일 (밀리초)

# Kakao OAuth Configuration
kakao:
  oauth:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/oauth/kakao}
    token-uri: https://kauth.kakao.com/oauth/token
    issuer: https://kauth.kakao.com
    audience: ${KAKAO_CLIENT_ID}

# External APIs Base URLs
finnhub:
  api:
    url: https://finnhub.io/api/v1

kis:
  api:
    url: https://openapi.koreainvestment.com:9443
    key: ${KIS_APP_KEY}
    secret: ${KIS_APP_SECRET}
    account: ${KIS_ACCOUNT_NUMBER}
    master:
      base-url: https://new.real.download.dws.co.kr/common/master

news:
  rss:
    base-url: https://news.google.com/rss/search
  api:
    naver:
      base-url: https://openapi.naver.com/v1/search/news.json
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
      display: 100
    gnews:
      base-url: https://gnews.io/api/v4/search
      api-key: ${GNEWS_API_KEY}
      lang: en
      max: 100
    newsapi:
      base-url: https://newsapi.org/v2/everything
      api-key: ${NEWSAPI_API_KEY}
      language: en
      page-size: 100

# Stock API (공공데이터포털 - KRX 상장종목정보)
stock:
  api:
    datagokr:
      base-url: https://apis.data.go.kr/1160100/service/GetKrxListedInfoService/getItemInfo
      service-key: ${DATAGOKR_SERVICE_KEY}
      num-of-rows: 100

# 한국수출입은행 환율 API
koreaexim:
  api:
    url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
    authkey: ${KOREAEXIM_API_KEY}

# Gemini API (챗봇)
gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash
  base-url: https://generativelanguage.googleapis.com

# DART OpenAPI (전자공시시스템)
dart:
  api:
    base-url: https://opendart.fss.or.kr/api
    crtfc-key: ${DART_API_KEY}

# SEC EDGAR API (미국 재무제표)
sec:
  api:
    base-url: https://data.sec.gov
    user-agent: ${SEC_USER_AGENT:stock-market admin@example.com}

# Scheduler Configuration
scheduler:
  stock:
    update:
      enabled: true
      cron: 0 */30 9-15 * * MON-FRI
  news:
    update:
      enabled: true
      cron: 0 0 */1 * * *
  logging:
    # 만료 월 인덱스 삭제 (직전월까지 유지, 그 이전은 DELETE)
    cleanup:
      cron: 0 0 3 * * *
    # 다음달 월 인덱스 pre-create (존재 시 noop)
    precreate:
      cron: 0 55 23 * * *

# Application-scoped Configuration
app:
  logging:
    admin:
      # 관리자 userId 화이트리스트. 빈 값 = 전면 차단 (fail-close).
      # .env: ADMIN_USER_IDS=1,2,3 형식 (쉼표 구분 Long)
      user-ids: ${ADMIN_USER_IDS:}

# Real Estate Market API (8개 공공 출처)
# 인증키 미설정 출처는 부팅 정상, fetch 시점에 어댑터가 IllegalStateException으로 skip 처리.
realestate:
  molit:
    base-url: https://apis.data.go.kr/1613000
    api-key: ${MOLIT_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  reb:
    base-url: https://www.reb.or.kr/r-one/openapi
    api-key: ${REB_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    # R-ONE STATBL 11개 매핑 — RebStatblProperties로 strong-typed 바인딩.
    # 각 entry: (statbl-id, dtacycle-cd). dtacycle-cd는 발표 주기 메타 (월간="MM" 추정, 첫 호출 시 검증).
    statbl:
      sale-price-total:        { statbl-id: A_2024_00017, dtacycle-cd: MM }   # 매매가격지수 주택종합
      sale-price-apt:          { statbl-id: A_2024_00048, dtacycle-cd: MM }   # 매매가격지수 아파트
      sale-price-rowhouse:     { statbl-id: A_2024_00083, dtacycle-cd: MM }   # 매매가격지수 연립/다세대
      sale-price-singlehouse:  { statbl-id: A_2024_00117, dtacycle-cd: MM }   # 매매가격지수 단독주택
      rent-price-total:        { statbl-id: A_2024_00020, dtacycle-cd: MM }   # 전세가격지수 주택종합
      rent-price-apt:          { statbl-id: A_2024_00053, dtacycle-cd: MM }   # 전세가격지수 아파트
      rent-price-rowhouse:     { statbl-id: A_2024_00088, dtacycle-cd: MM }   # 전세가격지수 연립/다세대
      rent-price-singlehouse:  { statbl-id: A_2024_00122, dtacycle-cd: MM }   # 전세가격지수 단독주택
      trade-volume-total:      { statbl-id: A_2024_00604, dtacycle-cd: MM }   # 거래량 주택종합
      trade-volume-apt:        { statbl-id: A_2024_00612, dtacycle-cd: MM }   # 거래량 아파트
      land-price-change:       { statbl-id: A_2024_00903, dtacycle-cd: MM }   # 지가변동률
  hub:
    base-url: https://apis.data.go.kr/1613000
    api-key: ${HUB_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  kosis:
    base-url: https://kosis.kr/openapi
    api-key: ${KOSIS_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  subscription-home:
    base-url: https://api.odcloud.kr/api
    api-key: ${SUBSCRIPTION_HOME_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  # HUG 분양보증사고 — 현재 비활성화 (2026-05-10 결정)
  # · data.go.kr는 링크데이터셋만 등록 (Open API 미제공) — 아래 base-url은 실제 작동 안 함
  # · HUG 자체 OPEN API(www.khug.or.kr)는 존재하나 응답 envelope/파라미터 schema가
  #   data.go.kr 표준과 달라 어댑터 전면 재작성 필요
  # · HUG_API_KEY 빈값 유지 시 BatchScheduler가 자동 skip
  # · 후속 sprint에서 폐기 vs 재작성 vs KOSIS 우회 결정. 자세한 내용은 HugAdapter javadoc 참조
  hug:
    base-url: https://apis.data.go.kr/B551408
    api-key: ${HUG_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  # 서울 OpenData는 https 미지원 확정 (TLS protocol version 에러) — http 유지
  # 보안 한계: 인증키가 URL path-segment(/{KEY}/json/...)로 노출되며 http 평문 전송
  # 후속: SecretMasker 정규식을 path-segment 형식까지 커버하도록 보강 권장
  seoul-open-data:
    base-url: http://openapi.seoul.go.kr:8088
    api-key: ${SEOUL_OPEN_DATA_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  gg-data-dream:
    base-url: https://openapi.gg.go.kr
    api-key: ${GG_DATA_DREAM_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

# Economics API
economics:
  api:
    korea:
      ecos:
        base-url: https://ecos.bok.or.kr/api/KeyStatisticList
        api-key: ${ECOS_API_KEY}
        start-count: 1
        end-count: 200
    global:
      fred:
        # 향후 FRED API 설정 위치
      tradingeconomics:
        base-url: https://ko.tradingeconomics.com
        timeout: 5000
        user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    elasticsearch:
      enabled: false