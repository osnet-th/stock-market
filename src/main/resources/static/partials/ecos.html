            <!-- ========== ECOS ========== -->

                <template x-if="ecos.loading && ecos.indicators.length === 0">

                            <template x-for="i in 6" :key="'sp-sk-'+i">
                                <div class="spread-card rounded-xl p-5 animate-pulse">
                                    <div class="h-3 bg-gray-200 rounded w-2/5 mb-3"></div>
                                    <div class="h-7 bg-gray-200 rounded w-1/2 mb-3"></div>
                                    <div class="h-1.5 bg-gray-200 rounded w-full mb-3"></div>
                                    <div class="h-3 bg-gray-200 rounded w-1/3"></div>
                                </div>
                            </template>
                        </div>
                        <div class="flex justify-center py-8">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </template>

                <!-- 지표 설명 (클릭 시 표시) -->
                <template x-if="ecos._tooltipText">
                    <div class="mb-3 bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 flex items-start gap-2">
                        <svg class="w-4 h-4 text-slate-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p class="text-xs text-slate-600 leading-relaxed flex-1" x-text="ecos._tooltipText"></p>
                        <button @click="ecos._tooltipText = ''"
                                class="text-slate-400 hover:text-slate-600 text-sm shrink-0">&times;</button>
                    </div>
                </template>

                <!-- ===== 사용자 커스텀 파생지표 (이슈 #36) ===== -->
                <div x-effect="currentPage === 'ecos' && ensureDerivedLoaded()">
                    <div class="flex items-center justify-between ecos-section-title">
                        <span x-text="derivedSectionTitle()"></span>
                        <button type="button" @click="openDerivedCreate()"
                                class="text-xs font-medium px-3 py-1.5 rounded-md bg-blue-500 text-white hover:bg-blue-600 transition">
                            + 새 파생지표

                    </div>

                    <!-- 에러 -->
                    <template x-if="derived.error">
                        <div class="mb-3 bg-red-50 border border-red-200 rounded-lg px-4 py-2 text-xs text-red-600"

                    </template>

                    <!-- 빈 상태: 현재 카테고리 프리셋 추천 -->
                    <template x-if="!derived.loading && derivedListForCategory().length === 0">
                        <div class="bg-white rounded-xl border border-gray-200 p-6 mb-8">
                            <p class="text-sm text-gray-600 mb-1">이 카테고리에 만든 파생지표가 없어요.</p>
                            <template x-if="derivedPresetsForCategory().length > 0">
                                <p class="text-xs text-gray-400 mb-4">아래 추천 프리셋을 추가하거나, 직접 새 파생지표를 만들어보세요.</p>
                            </template>
                            <template x-if="derivedPresetsForCategory().length === 0">
                                <p class="text-xs text-gray-400 mb-4">상단 <b>+ 새 파생지표</b>로 직접 만들어보세요.</p>
                            </template>
                            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                                <template x-for="ps in derivedPresetsForCategory()" :key="'ps-'+ps.key">
                                    <div class="border border-gray-200 rounded-lg p-3 flex flex-col gap-1">
                                        <span class="text-sm font-semibold text-gray-700" x-text="ps.name"></span>
                                        <span class="text-[11px] text-gray-400" x-text="derivedFormulaText(ps.formula)"></span>
                                        <p class="text-xs text-gray-400 flex-1" x-text="ps.description"></p>
                                        <button type="button" @click="copyDerivedPreset(ps.key)"
                                                class="self-start text-xs px-2 py-1 mt-1 rounded bg-gray-100 hover:bg-gray-200 text-gray-700">
                                            추가
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- 파생지표 목록 (현재 카테고리) -->
                    <template x-if="derivedListForCategory().length > 0">
                        <ul class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mb-8">
                            <template x-for="item in derivedListForCategory()" :key="'di-'+item.id">
                                <li>
                                    <div class="spread-card rounded-xl p-5 shadow-sm">
                                        <div class="flex items-start justify-between mb-2">
                                            <div>
                                                <span class="text-sm font-semibold text-gray-700" x-text="item.name"></span>
                                                <p class="text-[11px] text-gray-400 mt-0.5" x-text="derivedFormulaText(item.formula)"></p>
                                            </div>
                                            <div class="flex gap-1 shrink-0">
                                                <button type="button" @click="openDerivedEdit(item)"
                                                        class="text-gray-300 hover:text-blue-500 text-xs">수정</button>
                                                <button type="button" @click="removeDerived(item.id)"
                                                        class="text-gray-300 hover:text-red-500 text-xs">삭제</button>
                                            </div>
                                        </div>
                                        <div class="mb-2">
                                            <template x-if="item.computable">
                                                <p class="text-2xl font-bold font-mono-num leading-none text-gray-800"
                                                   x-text="derivedDisplayValue(item)"></p>
                                            </template>
                                            <template x-if="!item.computable">
                                                <p class="text-sm text-gray-400" x-text="derivedDisplayValue(item)"></p>
                                            </template>
                                        </div>
                                        <template x-if="item.description">
                                            <p class="text-xs text-gray-400" x-text="item.description"></p>
                                        </template>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <!-- 생성/수정 폼 -->
                    <template x-if="derived.showForm">
                        <div class="bg-white rounded-xl border border-gray-200 p-5 mb-8">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-sm font-semibold text-gray-700"
                                      x-text="derived.editingId ? '파생지표 수정' : '새 파생지표'"></span>
                                <button type="button" @click="closeDerivedForm()"
                                        class="text-gray-400 hover:text-gray-600 text-sm">&times;</button>
                            </div>

                            <!-- 이름 / 단위 -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">이름</label>
                                    <input type="text" x-model="derived.form.name" maxlength="100"
                                           class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm"
                                           placeholder="예: 장단기 금리차">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">단위</label>
                                    <input type="text" x-model="derived.form.unit" maxlength="30"
                                           class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm"
                                           placeholder="예: %p, 배">
                                </div>
                            </div>

                            <!-- 설명 -->
                            <div class="mb-3">
                                <label class="block text-xs text-gray-500 mb-1">설명 (선택)</label>
                                <input type="text" x-model="derived.form.description" maxlength="500"
                                       class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm"
                                       placeholder="이 지표가 무엇을 의미하는지">
                            </div>

                            <!-- 카테고리 (현재 탭 자동 적용, 같은 카테고리 지표만 조합) -->
                            <div class="mb-3">
                                <label class="block text-xs text-gray-500 mb-1">카테고리</label>
                                <div class="text-sm text-gray-700 bg-gray-50 border border-gray-200 rounded-md px-3 py-2">
                                    <span x-text="derivedCurrentCategoryLabel()"></span>
                                    <span class="text-[11px] text-gray-400 ml-1">· 같은 카테고리 지표만 조합됩니다</span>
                                </div>
                            </div>

                            <!-- 항 개수 -->
                            <div class="flex items-center gap-2 mb-3">
                                <span class="text-xs text-gray-500">항 개수</span>
                                <button type="button" @click="setDerivedTermCount(2)"
                                        :class="derived.form.termCount === 2 ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'"
                                        class="text-xs px-2 py-1 rounded">2항</button>
                                <button type="button" @click="setDerivedTermCount(3)"
                                        :class="derived.form.termCount === 3 ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'"
                                        class="text-xs px-2 py-1 rounded">3항</button>
                                <span class="text-[11px] text-gray-400">×÷가 +−보다 먼저 계산됩니다</span>
                            </div>

                            <!-- 수식 빌더 -->
                            <div class="space-y-2 mb-4">
                                <template x-for="i in derived.form.termCount" :key="'term-'+i">
                                    <div>
                                        <!-- 연산자 (2번째 항부터) -->
                                        <template x-if="i > 1">
                                            <div class="flex gap-1 mb-1">
                                                <template x-for="op in DERIVED_OPERATORS" :key="'op-'+i+'-'+op.value">
                                                    <button type="button" @click="derived.form.operators[i-2] = op.value"
                                                            :class="derived.form.operators[i-2] === op.value ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'"
                                                            class="text-xs w-8 py-1 rounded" x-text="op.symbol"></button>
                                                </template>
                                            </div>
                                        </template>
                                        <!-- 피연산자 -->
                                        <div class="flex gap-2 items-center">
                                            <select x-model="derived.form.operands[i-1].type"
                                                    class="border border-gray-200 rounded-md px-2 py-2 text-sm shrink-0">
                                                <option value="INDICATOR">지표</option>
                                                <option value="CONSTANT">상수</option>
                                            </select>
                                            <template x-if="derived.form.operands[i-1].type === 'INDICATOR'">
                                                <select :value="derivedOperandEncoded(derived.form.operands[i-1])"
                                                        @change="onDerivedOperandSelect(derived.form.operands[i-1], $event.target.value)"
                                                        class="flex-1 border border-gray-200 rounded-md px-2 py-2 text-sm">
                                                    <option value="">지표 선택</option>
                                                    <template x-for="ind in derivedAvailableForCategory()" :key="'ai-'+i+'-'+ind.className+'-'+ind.keystatName">
                                                        <option :value="ind.className + '::' + ind.keystatName" x-text="ind.keystatName"></option>
                                                    </template>
                                                </select>
                                            </template>
                                            <template x-if="derived.form.operands[i-1].type === 'CONSTANT'">
                                                <input type="number" x-model="derived.form.operands[i-1].value"
                                                       class="flex-1 border border-gray-200 rounded-md px-3 py-2 text-sm"
                                                       placeholder="숫자">
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="flex gap-2">
                                <button type="button" @click="submitDerived()"
                                        class="text-sm px-4 py-2 rounded-md bg-blue-500 text-white hover:bg-blue-600">
                                    <span x-text="derived.editingId ? '수정' : '만들기'"></span>
                                </button>
                                <button type="button" @click="closeDerivedForm()"
                                        class="text-sm px-4 py-2 rounded-md bg-gray-100 text-gray-600 hover:bg-gray-200">취소</button>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- ===== 뷰 모드 토글 + AI 분석 버튼 ===== -->
                <template x-if="!ecos.loading && ecos.indicators.length > 0">
                    <div class="flex items-center gap-4 mb-4">
                        <span class="text-sm font-medium text-gray-600">보기 방식</span>
                        <div class="inline-flex rounded-lg border border-gray-200 bg-white p-0.5">
                            <button @click="switchEcosViewMode('table')"
                                    :class="ecos.viewMode === 'table' ? 'bg-blue-500 text-white shadow-sm' : 'text-gray-600 hover:text-gray-800'"
                                    class="px-3 py-1.5 text-xs font-medium rounded-md transition-all">
                                표 보기
                            </button>
                            <button @click="switchEcosViewMode('chart')"
                                    :class="ecos.viewMode === 'chart' ? 'bg-blue-500 text-white shadow-sm' : 'text-gray-600 hover:text-gray-800'"
                                    class="px-3 py-1.5 text-xs font-medium rounded-md transition-all">
                                그래프 보기
                            </button>
                        </div>
                    </div>
                </template>

                <!-- ===== 차트 뷰 ===== -->
                <template x-if="!ecos.loading && ecos.viewMode === 'chart' && ecos.indicators.length > 0">
                    <div>
                        <!-- 차트 로딩 -->
                        <template x-if="ecos.historyLoading">
                            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                <template x-for="i in 6" :key="'skeleton-chart-'+i">
                                    <div class="bg-white rounded-xl border border-gray-200 p-4 animate-pulse">
                                        <div class="h-4 bg-gray-200 rounded w-1/2 mb-3"></div>
                                        <div class="h-48 bg-gray-100 rounded"></div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- 차트 카드 그리드 -->
                        <template x-if="!ecos.historyLoading && ecos.historyData.length > 0">
                            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                <template x-for="indicator in ecos.historyData" :key="indicator.keystatName">
                                    <div class="bg-white rounded-xl border border-gray-200 p-4">
                                        <div class="flex items-center justify-between mb-2">
                                            <h3 class="text-sm font-semibold text-gray-800 truncate" x-text="indicator.keystatName"></h3>
                                            <span class="text-xs text-gray-400 ml-2 shrink-0" x-text="indicator.unitName"></span>
                                        </div>
                                        <template x-if="indicator.history.length >= 2">
                                            <div class="h-48">
                                                <canvas :id="'ecos-chart-' + indicator.keystatName.replace(/[^a-zA-Z0-9가-힣]/g, '_')"></canvas>
                                            </div>
                                        </template>
                                        <template x-if="indicator.history.length < 2">
                                            <div class="h-48 flex items-center justify-center text-sm text-gray-400">
                                                데이터 부족
                                            </div>
                                        </template>
                                        <div class="mt-2 text-xs text-gray-400" x-text="indicator.className"></div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- 히스토리 없음 -->
                        <template x-if="!ecos.historyLoading && ecos.historyData.length === 0">
                            <div class="bg-white rounded-xl border border-gray-200 p-8 text-center text-gray-400 text-sm">
                                히스토리 데이터가 없습니다.
                            </div>
                        </template>
                    </div>
                </template>

                <!-- ===== 원시 지표 테이블 ===== -->
                <template x-if="!ecos.loading && ecos.viewMode === 'table' && ecos.indicators.length > 0">
                    <div>
                        <div class="ecos-section-title">원시 지표</div>

                        <!-- 원시 지표 설명 (클릭 시 표시) -->
                        <template x-if="ecos._rawTooltipText">
                            <div class="mb-3 bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 flex items-start gap-2">
                                <svg class="w-4 h-4 text-slate-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                <p class="text-xs text-slate-600 leading-relaxed flex-1" x-text="ecos._rawTooltipText"></p>
                                <button @click="ecos._rawTooltipText = ''"
                                        class="text-slate-400 hover:text-slate-600 text-sm shrink-0">&times;</button>
                            </div>
                        </template>
                        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="data-table w-full text-sm">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="w-8"></th>
                                            <th class="text-left py-3 px-4 text-gray-600 font-semibold">분류</th>
                                            <th class="text-left py-3 px-4 text-gray-600 font-semibold">지표명</th>
                                            <th class="text-right py-3 px-4 text-gray-600 font-semibold">값</th>
                                            <th class="text-right py-3 px-4 text-gray-600 font-semibold">변화</th>
                                            <th class="text-center py-3 px-4 text-gray-600 font-semibold">주기</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="(ind, idx) in getEcosSortedIndicators()" :key="ind.keystatName">
                                            <tr class="border-b border-gray-100">
                                                <td class="py-3 px-2 text-center w-8">
                                                    <button @click="toggleFavorite('ECOS', ecosIndicatorCode(ind))"
                                                            class="text-lg cursor-pointer hover:scale-110 transition-transform"
                                                            :class="isFavorited('ECOS', ecosIndicatorCode(ind)) ? 'text-yellow-400' : 'text-gray-300 hover:text-yellow-300'">
                                                        <span x-text="isFavorited('ECOS', ecosIndicatorCode(ind)) ? '★' : '☆'"></span>
                                                    </button>
                                                </td>
                                                <td class="py-3 px-4 text-gray-600" x-text="ind.className"></td>
                                                <td class="py-3 px-4 text-gray-800 font-medium">
                                                    <div class="flex items-center gap-1">
                                                        <span x-text="ind.keystatName"></span>
                                                        <template x-if="ind.description">
                                                            <button type="button"
                                                                    @click="ecos._rawTooltipText = ind.description"
                                                                    class="text-gray-300 hover:text-gray-500 cursor-pointer text-xs">&#9432;</button>
                                                        </template>
                                                    </div>
                                                </td>
                                                <td class="py-3 px-4 text-right font-mono-num text-gray-800 font-medium"
                                                    x-text="Format.withUnit(ind.dataValue, ind.unitName)"></td>
                                                <td class="py-3 px-4 text-right">
                                                    <template x-if="ind.previousDataValue">
                                                        <span class="text-sm font-medium font-mono-num"
                                                              :class="Format.change(ind.dataValue, ind.previousDataValue).className">
                                                            <span x-text="Format.change(ind.dataValue, ind.previousDataValue).symbol"></span>
                                                            <span x-text="Format.changeRate(ind.dataValue, ind.previousDataValue)"></span>
                                                        </span>
                                                    </template>
                                                    <template x-if="!ind.previousDataValue">
                                                        <span class="text-gray-400">-</span>
                                                    </template>
                                                </td>
                                                <td class="py-3 px-4 text-center">
                                                    <span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full"
                                                        x-text="ind.cycle"></span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 빈 상태 -->
                <template x-if="!ecos.loading && ecos.indicators.length === 0 && ecos.selectedCategory">
                    <div class="bg-white rounded-xl border border-gray-200 p-8 text-center text-gray-400 text-sm">
                        해당 카테고리에 지표가 없습니다.
                    </div>
                </template>
            </div>
