<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stock Market Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- #114 목업 폰트: IBM Plex Sans KR(본문) + IBM Plex Mono(숫자) -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
</head>
<body class="app-surface min-h-screen" x-data="dashboard()" x-cloak>

    <!-- ==================== HEADER (partial) ==================== -->
    <div data-partial="_header" aria-busy="true" aria-live="polite"></div>

    <div class="flex pt-14">
        <!-- ==================== SIDEBAR + DRAWER (partial: backdrop + 모바일 + 데스크탑 사이드바 통합) ==================== -->
        <div data-partial="_sidebar" aria-busy="true" aria-live="polite"></div>

        <!-- 부트 spinner: bootReady 이전 메인 영역 통일 로딩 표시 -->
        <div x-show="!bootReady" class="fixed inset-0 flex items-center justify-center bg-white/80 z-30 pointer-events-none">
            <div class="flex flex-col items-center gap-3 text-gray-500">
                <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                <span class="text-sm">메뉴 불러오는 중...</span>
            </div>
        </div>

        <!-- ==================== MAIN CONTENT ==================== -->
        <main :class="isMobile ? '' : (sidebarCollapsed ? 'lg:ml-14' : 'lg:ml-56')"
              class="flex-1 p-3 sm:p-4 lg:p-6 min-h-[calc(100dvh-3.5rem)] transition-all duration-300 min-w-0 overflow-x-hidden">

            <!-- ========== HOME (partial: 셸(헤더·브리핑) + 2단 본문) ========== -->
            <!-- 셸 다음에 본문 2단이 와야 화면 순서가 맞는다 (#114) -->
            <div data-partial="home" aria-busy="true" aria-live="polite"></div>
            <!-- 2단 그리드는 여기서 만든다. partial-loader 가 부트 시 host 를 한 번에 querySelector 하므로
                 home.html 안쪽에 host 를 두면 아직 마운트 전이라 잡히지 않는다 (#114) -->
            <div x-show="currentPage === 'home'" x-cloak
                 class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_320px] gap-4 items-start">
                <div data-partial="home-indicators" aria-busy="true" aria-live="polite" class="min-w-0"></div>
                <div data-partial="home-side" aria-busy="true" aria-live="polite" class="min-w-0"></div>
            </div>


            <!-- ========== KEYWORDS (partial) ========== -->
            <div data-partial="keywords" aria-busy="true" aria-live="polite"></div>


            <!-- ========== NEWS SEARCH (partial) ========== -->
            <div data-partial="news-search" aria-busy="true" aria-live="polite"></div>


            <!-- ========== ECOS (partial) ========== -->
            <div data-partial="ecos" aria-busy="true" aria-live="polite"></div>


            <!-- ========== GLOBAL (partial) ========== -->
            <div data-partial="global" aria-busy="true" aria-live="polite"></div>


            <!-- ========== PORTFOLIO (partial: 셸 + 4탭 본문 + 4 modal partials) ========== -->
            <!-- 셸(헤더·탭 내비) 다음에 탭 본문 partial 이 와야 화면 순서가 맞는다 (#110) -->
            <div data-partial="portfolio" aria-busy="true" aria-live="polite"></div>
            <div data-partial="portfolio-holdings" aria-busy="true" aria-live="polite"></div>
            <div data-partial="portfolio-sales" aria-busy="true" aria-live="polite"></div>
            <div data-partial="portfolio-targets" aria-busy="true" aria-live="polite"></div>
            <div data-partial="portfolio-analysis" aria-busy="true" aria-live="polite"></div>
            <div data-partial="portfolio-add" aria-busy="true" aria-live="polite"></div>
            <div data-partial="portfolio-edit" aria-busy="true" aria-live="polite"></div>
            <div data-partial="portfolio-sale" aria-busy="true" aria-live="polite"></div>
            <div data-partial="portfolio-deposit-financial" aria-busy="true" aria-live="polite"></div>


            <!-- ========== STOCK EVALUATION (종목 평가, partial) ========== -->
            <div data-partial="stock-eval" aria-busy="true" aria-live="polite"></div>


            <!-- ========== COMPANY REPORT (기업 리포트, partial) ========== -->
            <div data-partial="company-report" aria-busy="true" aria-live="polite"></div>


            <!-- ========== REAL ESTATE (partial) ========== -->
            <div data-partial="realestate" aria-busy="true" aria-live="polite"></div>


            <!-- ========== SALARY USAGE RATIO (partial) ========== -->
            <div data-partial="salary" aria-busy="true" aria-live="polite"></div>


            <!-- ========== NEWS JOURNAL (partial) ========== -->
            <div data-partial="news-journal" aria-busy="true" aria-live="polite"></div>


            <!-- ========== GLOSSARY (개인 용어 사전, partial) ========== -->
            <div data-partial="glossary" aria-busy="true" aria-live="polite"></div>


            <!-- ========== ADMIN LOGS (partial, secured) ========== -->
            <div data-partial="admin-logs" data-secured="true" aria-busy="true" aria-live="polite"></div>

        </div>
    </div>

    <!-- ==================== 챗봇 (partial) ==================== -->
    <div data-partial="_chat" aria-busy="true" aria-live="polite"></div>


    <!-- Scripts (순서 중요: api > utils > marked > components > app > Alpine) -->
    <script src="/js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/utils/format.js"></script>
    <script src="/js/utils/partial-loader.js"></script>

    <!-- 컴포넌트 (순서 무관 - 객체 리터럴 선언만) -->
    <script src="/js/components/auth.js"></script>
    <script src="/js/components/home.js"></script>
    <script src="/js/components/keyword.js"></script>
    <script src="/js/components/news.js"></script>
    <script src="/js/components/news-search.js"></script>
    <script src="/js/components/ecos.js"></script>
    <script src="/js/components/derivedIndicator.js"></script>
    <script src="/js/components/global.js"></script>
    <script src="/js/components/portfolio.js"></script>
    <script src="/js/components/financial.js"></script>
    <script src="/js/components/chat.js"></script>
    <script src="/js/components/favorite.js"></script>
    <script src="/js/components/salary.js"></script>
    <script src="/js/components/news-journal.js"></script>
    <script src="/js/components/glossary.js"></script>
    <script src="/js/components/admin-logs.js"></script>
    <script src="/js/components/dashboardSummary.js"></script>
    <script src="/js/components/realestate.js"></script>
    <script src="/js/components/stock-eval.js"></script>
    <script src="/js/components/company-report.js"></script>

    <!-- 메인 앱 (컴포넌트 통합) -->
    <script src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</body>
</html>
