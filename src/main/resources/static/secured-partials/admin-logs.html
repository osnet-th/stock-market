            <!-- ========== ADMIN LOGS (운영자 전용) ========== -->
            <div x-show="currentPage === 'admin-logs'" x-cloak>
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-gray-800">운영자 로그</h2>
                    <div class="flex items-center gap-2 text-sm">
                        <span class="text-gray-500">인덱스 용량</span>
                        <span class="px-2 py-1 rounded font-medium"
                              :class="adminLogs.diskUsage.totalBytes > 50 * 1024 * 1024 * 1024 * 0.8
                                      ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'"
                              x-text="formatAdminLogBytes(adminLogs.diskUsage.totalBytes)"></span>
                        <span class="text-gray-400 text-xs"
                              x-text="adminLogs.diskUsage.totalDocs + ' docs'"></span>
                    </div>
                </div>

                <!-- 403 안내 -->
                <template x-if="adminLogs.forbidden">
                    <div class="bg-white border border-red-200 rounded-lg p-8 text-center">
                        <p class="text-red-600 font-medium">관리자 권한 필요</p>
                        <p class="text-gray-500 text-sm mt-2">이 페이지는 운영자 화이트리스트에 포함된 계정만 접근할 수 있습니다.</p>
                    </div>
                </template>

                <template x-if="!adminLogs.forbidden">
                    <div>
                        <!-- 도메인 탭 -->
                        <div class="flex gap-1 mb-4 border-b border-gray-200">
                            <template x-for="d in ['audit', 'error', 'business']" :key="d">
                                <button @click="switchAdminLogDomain(d)"
                                        :class="adminLogs.domain === d
                                                ? 'border-indigo-600 text-indigo-600 font-semibold'
                                                : 'border-transparent text-gray-500 hover:text-gray-800'"
                                        class="px-4 py-2 border-b-2 text-sm transition"
                                        x-text="d"></button>
                            </template>
                        </div>

                        <!-- 필터바 -->
                        <div class="bg-white rounded-lg p-4 border border-gray-200 mb-4 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-3">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">From</label>
                                <input type="datetime-local" x-model="adminLogs.filter.from"
                                       @change="searchAdminLogs(); aggregateAdminLogs()"
                                       class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm"/>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">To</label>
                                <input type="datetime-local" x-model="adminLogs.filter.to"
                                       @change="searchAdminLogs(); aggregateAdminLogs()"
                                       class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm"/>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">userId</label>
                                <input type="number" x-model="adminLogs.filter.userId"
                                       @input="debounceAdminLogSearch()"
                                       placeholder="예: 1"
                                       class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm"/>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">requestId (q)</label>
                                <input type="text" x-model="adminLogs.filter.q"
                                       @input="debounceAdminLogSearch()"
                                       placeholder="UUID"
                                       class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm"/>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">status</label>
                                <input type="number" x-model="adminLogs.filter.status"
                                       @change="searchAdminLogs()"
                                       placeholder="200, 500"
                                       class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm"/>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">exceptionClass</label>
                                <input type="text" x-model="adminLogs.filter.exceptionClass"
                                       @input="debounceAdminLogSearch()"
                                       placeholder="IllegalArgumentException"
                                       class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm"/>
                            </div>
                        </div>

                        <!-- 액션 -->
                        <div class="flex items-center justify-between mb-3">
                            <div class="text-sm text-gray-500">
                                <span>총 </span>
                                <span class="font-semibold text-gray-800" x-text="adminLogs.total"></span>
                                <span> 건</span>
                            </div>
                            <button @click="downloadAdminLogs()"
                                    class="px-3 py-1.5 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition">
                                원문 다운로드 (JSON)
                            </button>
                        </div>

                        <!-- 집계 차트 -->
                        <div class="bg-white rounded-lg p-4 border border-gray-200 mb-4">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-sm text-gray-600">일별 건수 (막대 클릭 시 해당 일자로 기간 필터)</span>
                                <span class="text-xs text-gray-400"
                                      x-text="'interval: ' + adminLogs.aggregation.interval"></span>
                            </div>
                            <div class="h-48">
                                <canvas id="admin-logs-chart"></canvas>
                            </div>
                        </div>

                        <!-- 결과 목록 -->
                        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-50">
                                        <tr class="text-left text-xs text-gray-500">
                                            <th class="px-3 py-2">timestamp</th>
                                            <th class="px-3 py-2">userId</th>
                                            <th class="px-3 py-2">requestId</th>
                                            <th class="px-3 py-2">status</th>
                                            <th class="px-3 py-2">exceptionClass</th>
                                            <th class="px-3 py-2 text-right">payload</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="item in adminLogs.list" :key="item.id">
                                            <tr class="border-t border-gray-100 hover:bg-gray-50 cursor-pointer"
                                                @click="openAdminLogModal(item)">
                                                <td class="px-3 py-2 text-gray-700 whitespace-nowrap"
                                                    x-text="formatAdminLogTimestamp(item.timestamp)"></td>
                                                <td class="px-3 py-2 text-gray-700" x-text="item.userId ?? '-'"></td>
                                                <td class="px-3 py-2 text-gray-500 font-mono text-xs"
                                                    x-text="item.requestId"></td>
                                                <td class="px-3 py-2">
                                                    <span x-show="item.status" x-text="item.status"
                                                          :class="item.status >= 500 ? 'text-red-600 font-semibold'
                                                                   : item.status >= 400 ? 'text-amber-600' : 'text-gray-700'"></span>
                                                </td>
                                                <td class="px-3 py-2 text-gray-600" x-text="item.exceptionClass ?? ''"></td>
                                                <td class="px-3 py-2 text-right text-indigo-600 text-xs">보기</td>
                                            </tr>
                                        </template>
                                        <template x-if="!adminLogs.loading && adminLogs.list.length === 0">
                                            <tr>
                                                <td colspan="6" class="px-3 py-8 text-center text-gray-400 text-sm">
                                                    조회 결과가 없습니다
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <!-- 더보기 -->
                            <div class="p-3 border-t border-gray-100 text-center"
                                 x-show="adminLogs.nextSearchAfter">
                                <button @click="loadMoreAdminLogs()"
                                        :disabled="adminLogs.loading"
                                        class="px-4 py-1.5 text-sm text-indigo-600 hover:text-indigo-700 disabled:text-gray-400">
                                    <span x-show="!adminLogs.loading">더 보기</span>
                                    <span x-show="adminLogs.loading">불러오는 중...</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
