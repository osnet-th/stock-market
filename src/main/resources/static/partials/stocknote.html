                                        <div>
                                            <label class="block text-xs text-gray-600 mb-1">현금흐름</label>
                                            <select x-model="stocknote.drawer.form.cashflowImpact" @change="persistStocknoteDraft()" class="w-full border rounded px-1 py-1 text-xs">
                                                <option value="">-</option>
                                                <template x-for="v in stocknote.FIXED_ENUMS.impactLevel" :key="v">
                                                    <option :value="v" x-text="v"></option>
                                                </template>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-4 text-xs">
                                        <label class="flex items-center gap-1">
                                            <input type="checkbox" x-model="stocknote.drawer.form.oneTime" @change="persistStocknoteDraft()">
                                            <span>일회성</span>
                                        </label>
                                        <label class="flex items-center gap-1">
                                            <input type="checkbox" x-model="stocknote.drawer.form.structural" @change="persistStocknoteDraft()">
                                            <span>구조적 변화</span>
                                        </label>
                                    </div>
                                </div>
                            </section>

                            <!-- Section 3: 판단 & 밸류에이션 -->
                            <section>
                                <h4 class="font-semibold text-gray-800 border-b pb-1 mb-3">3. 판단 & 밸류에이션</h4>
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-xs text-gray-600 mb-1">내 판단</label>
                                        <div class="flex flex-wrap gap-2">
                                            <template x-for="v in stocknote.FIXED_ENUMS.userJudgment" :key="v">
                                                <label class="flex items-center gap-1 text-xs">
                                                    <input type="radio" :value="v" x-model="stocknote.drawer.form.initialJudgment"
                                                           @change="persistStocknoteDraft()">
                                                    <span x-text="stocknoteJudgmentLabel(v)"></span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-600 mb-1">반대 논리 / 반증 조건</label>
                                        <textarea rows="2" x-model="stocknote.drawer.form.riskText"
                                                  @change="persistStocknoteDraft()" maxlength="4000"
                                                  class="w-full border rounded px-2 py-1 text-xs"></textarea>
                                    </div>
                                    <div class="grid grid-cols-3 gap-2">
                                        <div>
                                            <label class="block text-xs text-gray-600 mb-1">PER</label>
                                            <input type="number" step="0.01" x-model="stocknote.drawer.form.per" @change="persistStocknoteDraft()" class="w-full border rounded px-1 py-1 text-xs">
                                        </div>
                                        <div>
                                            <label class="block text-xs text-gray-600 mb-1">PBR</label>
                                            <input type="number" step="0.01" x-model="stocknote.drawer.form.pbr" @change="persistStocknoteDraft()" class="w-full border rounded px-1 py-1 text-xs">
                                        </div>
                                        <div>
                                            <label class="block text-xs text-gray-600 mb-1">EV/EBITDA</label>
                                            <input type="number" step="0.01" x-model="stocknote.drawer.form.evEbitda" @change="persistStocknoteDraft()" class="w-full border rounded px-1 py-1 text-xs">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-600 mb-1">과거 평균 대비</label>
                                        <div class="flex gap-3 text-xs">
                                            <template x-for="v in stocknote.FIXED_ENUMS.vsAverage" :key="v">
                                                <label class="flex items-center gap-1">
                                                    <input type="radio" :value="v" x-model="stocknote.drawer.form.vsAverage"
                                                           @change="persistStocknoteDraft()">
                                                    <span x-text="v"></span>
                                                </label>
                                            </template>
                                            <label class="flex items-center gap-1">
                                                <input type="radio" value="" x-model="stocknote.drawer.form.vsAverage" @change="persistStocknoteDraft()">
                                                <span>-</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <div class="sticky bottom-0 -mx-5 px-5 py-3 bg-white border-t border-gray-200 flex items-center justify-end gap-2 shadow-[0_-4px_8px_-4px_rgba(0,0,0,0.08)]"
                                 style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
                                <button @click="closeStocknoteDrawer()"
                                        class="px-4 py-2 border rounded text-sm text-gray-700 hover:bg-gray-50">취소</button>
                                <button @click="submitStocknoteNote()"
                                        :disabled="stocknote.drawer.saving"
                                        class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 disabled:opacity-40">
                                    <span x-show="!stocknote.drawer.saving">저장</span>
                                    <span x-show="stocknote.drawer.saving">저장 중…</span>
                                </button>
                            </div>
                        </div>
                    </aside>
                </div>

                <!-- STOCKNOTE / drawer end -->

                <!-- STOCKNOTE / detail-panel (검증 폼 + 유사 패턴, Phase 8) start -->
                <div x-show="stocknote.detailOpen" x-cloak
                     class="fixed inset-0 z-40 bg-black/40"
                     @click.self="closeStocknoteDetail()">
                    <aside class="fixed right-0 top-0 bottom-0 w-full sm:w-[560px] bg-white shadow-2xl overflow-y-auto">
                        <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-gray-800">기록 상세</h3>
                            <button @click="closeStocknoteDetail()" class="text-gray-400 hover:text-gray-700">✕</button>
                        </div>
                        <template x-if="stocknote.detail">
                            <div class="p-5 space-y-4 text-sm">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-base text-gray-900" x-text="stocknote.detail.note.stockCode"></span>
                                    <span :class="stocknote.detail.note.direction === 'UP' ? 'text-red-600' : 'text-blue-600'"
                                          x-text="stocknoteDirectionLabel(stocknote.detail.note.direction)"></span>
                                    <span class="text-gray-500" x-text="stocknote.detail.note.noteDate"></span>
                                </div>
                                <div>
                                    <h4 class="text-xs text-gray-500 mb-1">직접 트리거</h4>
                                    <p class="text-gray-800 whitespace-pre-wrap" x-text="stocknote.detail.note.triggerText || '-'"></p>
                                </div>
                                <div>
                                    <h4 class="text-xs text-gray-500 mb-1">시장 해석</h4>
                                    <p class="text-gray-800 whitespace-pre-wrap" x-text="stocknote.detail.note.interpretationText || '-'"></p>
                                </div>
                                <div>
                                    <h4 class="text-xs text-gray-500 mb-1">반대 논리</h4>
                                    <p class="text-gray-800 whitespace-pre-wrap" x-text="stocknote.detail.note.riskText || '-'"></p>
                                </div>
                                <div>
                                    <h4 class="text-xs text-gray-500 mb-1">태그</h4>
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="(tag, idx) in stocknote.detail.tags" :key="idx">
                                            <span class="text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-700"
                                                  x-text="stocknoteTagLabel(tag)"></span>
                                        </template>
                                    </div>
                                </div>
                                <div>
                                    <h4 class="text-xs text-gray-500 mb-1">스냅샷</h4>
                                    <ul class="space-y-1">
                                        <template x-for="s in stocknote.detail.snapshots" :key="s.snapshotType">
                                            <li class="flex items-center justify-between gap-2 text-xs">
                                                <span class="text-gray-600 w-20" x-text="s.snapshotType"></span>
                                                <span class="flex-1 text-right">
                                                    <span :class="{
                                                            'text-emerald-700': s.status === 'SUCCESS',
                                                            'text-amber-700': s.status === 'PENDING',
                                                            'text-red-700': s.status === 'FAILED' || s.status === 'DELISTED' || s.status === 'SUSPENDED'
                                                          }"
                                                          x-text="s.status + (s.changePercent != null ? ' / ' + s.changePercent + '%' : '')"></span>
                                                    <template x-if="s.failureReason">
                                                        <span class="block text-[10px] text-red-500 truncate" :title="s.failureReason"
                                                              x-text="'사유: ' + s.failureReason"></span>
                                                    </template>
                                                </span>
                                                <template x-if="s.status === 'FAILED' || s.status === 'PENDING'">
                                                    <button @click="retryStocknoteSnapshot(s.snapshotType)"
                                                            class="px-2 py-0.5 text-[11px] border border-blue-300 text-blue-700 rounded hover:bg-blue-50">
                                                        재시도
                                                    </button>
                                                </template>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                                <div>
                                    <h4 class="text-xs text-gray-500 mb-1">검증</h4>
                                    <template x-if="stocknote.detail.verification">
                                        <div class="p-2 bg-emerald-50 border border-emerald-200 rounded mb-2">
                                            <p class="text-emerald-800 text-sm font-medium"
                                               x-text="'현재: ' + stocknoteVerificationLabel(stocknote.detail.verification.judgmentResult) + ' (본문 잠금 상태)'"></p>
                                            <p class="text-xs text-gray-600 whitespace-pre-wrap mt-1"
                                               x-text="stocknote.detail.verification.verificationNote || ''"></p>
                                            <div class="mt-2 flex gap-2">
                                                <button @click="removeStocknoteVerification()"
                                                        class="text-xs text-red-600 hover:text-red-800">검증 삭제 (잠금 해제)</button>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- 검증 입력 폼 (검증이 없거나, 수정 시에도 같은 폼 재사용) -->
                                    <div class="border rounded p-2 space-y-2 bg-gray-50">
                                        <div class="flex flex-wrap gap-2">
                                            <template x-for="r in ['CORRECT', 'WRONG', 'PARTIAL']" :key="r">
                                                <label class="flex items-center gap-1 text-xs">
                                                    <input type="radio" :value="r" x-model="stocknote.verificationForm.judgmentResult">
                                                    <span x-text="stocknoteVerificationLabel(r)"></span>
                                                </label>
                                            </template>
                                        </div>
                                        <textarea rows="2" x-model="stocknote.verificationForm.verificationNote"
                                                  placeholder="검증 사유 / 피드백"
                                                  maxlength="4000"
                                                  class="w-full border rounded px-2 py-1 text-xs"></textarea>
                                        <template x-if="stocknote.verificationForm.error">
                                            <p class="text-xs text-red-600" x-text="stocknote.verificationForm.error"></p>
                                        </template>
                                        <button @click="submitStocknoteVerification()"
                                                :disabled="stocknote.verificationForm.saving"
                                                class="px-3 py-1 bg-emerald-600 text-white rounded text-xs disabled:opacity-40">
                                            <span x-show="!stocknote.verificationForm.saving"
                                                  x-text="stocknote.detail.verification ? '검증 수정' : '검증 저장 (잠금 발효)'"></span>
                                            <span x-show="stocknote.verificationForm.saving">저장 중…</span>
                                        </button>
                                    </div>
                                </div>

                                <!-- 유사 패턴 -->
                                <div>
                                    <h4 class="text-xs text-gray-500 mb-1">유사 패턴 (태그 조합 기반)</h4>
                                    <template x-if="stocknote.similarLoading">
                                        <p class="text-xs text-gray-400">로딩 중…</p>
                                    </template>
                                    <template x-if="!stocknote.similarLoading && stocknote.similar">
                                        <div class="border rounded p-2 bg-gray-50">
                                            <template x-if="!stocknote.similar.matches || stocknote.similar.matches.length === 0">
                                                <p class="text-xs text-gray-400">매칭된 과거 기록이 없습니다.</p>
                                            </template>
                                            <template x-if="stocknote.similar.matches && stocknote.similar.matches.length > 0">
                                                <div>
                                                    <p class="text-xs text-gray-700 mb-1">
                                                        <span x-text="'총 ' + stocknote.similar.aggregate.total + '건'"></span>
                                                        <span class="text-gray-500"> / </span>
                                                        <span class="text-emerald-700" x-text="'적중 ' + stocknote.similar.aggregate.correct"></span>
                                                        <span class="text-rose-700" x-text="' / 오판 ' + stocknote.similar.aggregate.wrong"></span>
                                                        <span class="text-amber-700" x-text="' / 부분 ' + stocknote.similar.aggregate.partial"></span>
                                                    </p>
                                                    <p class="text-xs text-gray-500 mb-2">
                                                        <span x-show="stocknote.similar.aggregate.avgD7Percent != null"
                                                              x-text="'평균 D+7: ' + stocknote.similar.aggregate.avgD7Percent + '%'"></span>
                                                        <span x-show="stocknote.similar.aggregate.avgD30Percent != null"
                                                              x-text="' / 평균 D+30: ' + stocknote.similar.aggregate.avgD30Percent + '%'"></span>
                                                    </p>
                                                    <ul class="divide-y divide-gray-200 text-xs">
                                                        <template x-for="m in stocknote.similar.matches.slice(0, 5)" :key="m.noteId">
                                                            <li @click="openStocknoteDetail(m.noteId)"
                                                                class="py-1 flex items-center gap-2 hover:bg-white cursor-pointer">
                                                                <span class="text-gray-500" x-text="m.noteDate"></span>
                                                                <span :class="m.direction === 'UP' ? 'text-red-600' : 'text-blue-600'"
                                                                      x-text="stocknoteDirectionLabel(m.direction)"></span>
                                                                <span x-text="m.stockCode"></span>
                                                                <span class="ml-auto text-gray-500"
                                                                      x-text="(m.d7ChangePercent != null ? 'D+7 ' + m.d7ChangePercent + '%' : '') +
                                                                              (m.d30ChangePercent != null ? ' / D+30 ' + m.d30ChangePercent + '%' : '')"></span>
                                                                <span class="text-xs"
                                                                      :class="m.judgmentResult === 'CORRECT' ? 'text-emerald-700' : (m.judgmentResult === 'WRONG' ? 'text-rose-700' : 'text-gray-500')"
                                                                      x-text="stocknoteVerificationLabel(m.judgmentResult)"></span>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </aside>
                </div>
            </div>
            <!-- STOCKNOTE / detail-panel end -->
            <!-- ========== STOCK NOTE end ========== -->
