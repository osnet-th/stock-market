            <!-- ========== PORTFOLIO / 목표 배분 탭 (#110) ========== -->
            <!-- 편차 막대·밴드 음영은 #107 구현을 그대로 사용한다 -->
            <div x-show="currentPage === 'portfolio' && portfolio.activeTab === 'targets'" x-cloak>
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
                    <!-- 좌: 목표 배분 현황 -->
                    <div class="bg-white rounded-xl border border-gray-200 p-5 xl:col-span-2">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                            <h3 class="text-sm font-bold text-gray-700">목표 자산 배분</h3>
                            <div class="flex items-center gap-2">
                                <template x-if="portfolio.allocationStatus && portfolio.allocationStatus.configured">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-xs text-gray-500">허용밴드</span>
                                        <button @click="adjustBand(-0.5)"
                                            class="w-6 h-6 rounded border border-gray-300 text-gray-500 hover:border-gray-500 transition leading-none">−</button>
                                        <span class="text-xs font-mono font-semibold text-gray-700 w-12 text-center"
                                            x-text="'±' + Number(portfolio.allocationStatus.bandPctPoint).toFixed(1) + '%p'"></span>
                                        <button @click="adjustBand(0.5)"
                                            class="w-6 h-6 rounded border border-gray-300 text-gray-500 hover:border-gray-500 transition leading-none">+</button>
                                    </div>
                                </template>
                                <button @click="openAllocationTargetModal()"
                                    class="text-xs text-blue-600 hover:text-blue-800 font-medium transition">목표 설정</button>
                            </div>
                        </div>

                        <template x-if="!portfolio.allocationStatus">
                            <p class="text-xs text-gray-400">배분 현황을 불러오지 못했습니다.</p>
                        </template>

                        <template x-if="portfolio.allocationStatus && !portfolio.allocationStatus.configured">
                            <p class="text-xs text-gray-400">
                                목표 비율이 아직 없습니다. [목표 설정]에서 안전자산/투자자산 비율을 정해 두면
                                수익으로 비율이 틀어졌을 때 초과 금액과 %p를 알려드립니다.
                            </p>
                        </template>

                        <template x-if="portfolio.allocationStatus && portfolio.allocationStatus.configured
                            && Number(portfolio.allocationStatus.totalEvaluated) === 0">
                            <p class="text-xs text-gray-400">평가할 자산이 없어 배분 현황을 계산할 수 없습니다.</p>
                        </template>

                        <template x-if="portfolio.allocationStatus && portfolio.allocationStatus.configured
                            && Number(portfolio.allocationStatus.totalEvaluated) > 0">
                            <div>
                                <!-- 리밸런싱 요약 (#107) -->
                                <template x-if="getRebalanceSummary()">
                                    <div class="bg-blue-50 rounded-lg px-3 py-2 mb-4">
                                        <span class="text-xs text-blue-700" x-text="getRebalanceSummary()"></span>
                                    </div>
                                </template>

                                <!-- 상위 안전/투자 버킷: 0 기준 편차 막대 -->
                                <div class="space-y-2.5">
                                    <template x-for="bucket in portfolio.allocationStatus.buckets" :key="bucket.bucket">
                                        <div class="flex items-center gap-3 text-xs">
                                            <span class="font-medium text-gray-700 w-16 shrink-0" x-text="bucket.bucketName"></span>
                                            <span class="text-gray-400 w-24 shrink-0 text-right font-mono"
                                                x-text="formatAllocRatioPair(bucket)"></span>
                                            <div class="flex-1 relative bg-gray-100 rounded h-4">
                                                <div class="absolute inset-y-0 bg-gray-200 border-x border-gray-300"
                                                    :style="getDeviationBandStyle()"></div>
                                                <div class="absolute top-0.5 bottom-0.5 rounded-sm transition-all duration-500"
                                                    :class="getDeviationBarClass(bucket)" :style="getDeviationBarStyle(bucket)"></div>
                                                <div class="absolute -top-0.5 -bottom-0.5 left-1/2 w-px bg-gray-500"></div>
                                            </div>
                                            <span class="w-44 shrink-0 text-right font-mono"
                                                :class="getDeviationTextClass(bucket)" x-text="formatDeviationLabel(bucket)"></span>
                                        </div>
                                    </template>
                                </div>

                                <!-- 투자자산 내부 자산군 -->
                                <template x-if="portfolio.allocationStatus.investAssets && portfolio.allocationStatus.investAssets.length > 0">
                                    <div class="mt-4 pt-3 border-t border-gray-100">
                                        <p class="text-xs font-semibold text-gray-500 mb-2">투자자산 내부 (투자자산 총액 대비)</p>
                                        <div class="space-y-2">
                                            <template x-for="asset in portfolio.allocationStatus.investAssets" :key="asset.assetType">
                                                <div class="flex items-center gap-3 text-xs">
                                                    <span :class="getAssetTypeBadgeClass(asset.assetType)"
                                                        class="px-2 py-0.5 rounded-full font-medium w-16 text-center shrink-0"
                                                        x-text="asset.assetTypeName"></span>
                                                    <span class="text-gray-400 w-24 shrink-0 text-right font-mono"
                                                        x-text="formatAllocRatioPair(asset)"></span>
                                                    <div class="flex-1 relative bg-gray-100 rounded h-3">
                                                        <div class="absolute inset-y-0 bg-gray-200 border-x border-gray-300"
                                                            :style="getDeviationBandStyle()"></div>
                                                        <div class="absolute top-0.5 bottom-0.5 rounded-sm transition-all duration-500"
                                                            :class="getDeviationBarClass(asset)" :style="getDeviationBarStyle(asset)"></div>
                                                        <div class="absolute -top-0.5 -bottom-0.5 left-1/2 w-px bg-gray-500"></div>
                                                    </div>
                                                    <span class="w-44 shrink-0 text-right font-mono"
                                                        :class="getDeviationTextClass(asset)" x-text="formatDeviationLabel(asset)"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- 범례 · 암호화폐 제외 안내 -->
                                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-4 pt-3 border-t border-gray-100 text-xs text-gray-400">
                                    <span class="flex items-center gap-1.5">
                                        <span class="inline-block w-2.5 h-2.5 rounded-sm bg-red-400"></span>목표보다 많음 → 줄이기
                                    </span>
                                    <span class="flex items-center gap-1.5">
                                        <span class="inline-block w-2.5 h-2.5 rounded-sm bg-blue-400"></span>목표보다 적음 → 채우기
                                    </span>
                                    <span class="flex items-center gap-1.5">
                                        <span class="inline-block w-2.5 h-2.5 rounded-sm bg-gray-200 border border-gray-300"></span>허용밴드
                                        ±<span x-text="Number(portfolio.allocationStatus.bandPctPoint).toFixed(1)"></span>%p
                                    </span>
                                    <template x-if="portfolio.allocationStatus.excludedCryptoCount > 0">
                                        <span>배분 제외: 암호화폐 <span x-text="portfolio.allocationStatus.excludedCryptoCount"></span>건</span>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- 우: 리밸런싱 제안 -->
                    <div class="bg-white rounded-xl border border-gray-200 p-5">
                        <div class="flex items-baseline justify-between mb-3">
                            <h3 class="text-sm font-bold text-gray-700">리밸런싱 제안</h3>
                            <span class="text-xs text-gray-400 font-mono"
                                x-text="'밴드 이탈 ' + getBandExceededCount() + '건'"></span>
                        </div>

                        <template x-if="getBandExceededCount() > 0">
                            <div>
                                <div class="bg-gray-50 rounded-lg border border-gray-100 px-4 py-3 mb-3">
                                    <p class="text-xs text-gray-500 mb-1">총 이동 금액</p>
                                    <p class="text-lg font-bold text-gray-800 font-mono"
                                        x-text="formatKrwCompact(getRebalanceMoveTotal())"></p>
                                    <p class="text-xs text-gray-500 mt-1 leading-relaxed" x-text="getRebalanceMoveNote()"></p>
                                </div>
                                <div class="space-y-2">
                                    <template x-for="action in getRebalanceActions()" :key="action.key">
                                        <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-100 border-l-[3px]"
                                            :class="action.over ? 'border-l-red-400' : 'border-l-blue-400'">
                                            <div class="flex-1 min-w-0">
                                                <div class="flex items-center gap-1.5">
                                                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500 shrink-0"
                                                        x-text="action.levelLabel"></span>
                                                    <p class="text-xs text-gray-700 truncate" x-text="action.name"></p>
                                                </div>
                                                <p class="text-[11px] text-gray-400 font-mono truncate mt-0.5" x-text="action.detail"></p>
                                            </div>
                                            <div class="text-right shrink-0">
                                                <p class="text-sm font-semibold font-mono"
                                                    :class="action.over ? 'text-red-500' : 'text-blue-500'"
                                                    x-text="formatKrwCompact(action.amount)"></p>
                                                <p class="text-[11px] text-gray-500" x-text="action.verb"></p>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                                <button @click="copyRebalanceChecklist()"
                                    class="w-full mt-3 py-2.5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 transition">
                                    체크리스트 복사
                                </button>
                                <p class="text-[11px] text-gray-400 mt-2 text-center">증권사 주문 연동은 제공하지 않습니다 — 금액 제안까지만</p>
                            </div>
                        </template>

                        <template x-if="getBandExceededCount() === 0">
                            <div class="py-8 text-center text-xs text-gray-400 bg-gray-50 rounded-lg">
                                모든 자산군이 허용밴드 안에 있습니다.
                            </div>
                        </template>
                    </div>
                </div>
            </div>
