                                <div class="flex items-center justify-between mb-2">
                                    <p class="text-sm font-semibold text-gray-600 flex items-center gap-1">
                                        <span class="text-yellow-400">&#9733;</span> 관심 지표 — 그래프
                                    </p>
                                    <div class="flex gap-1">
                                        <template x-if="!isEditing('GLOBAL', 'GRAPH')">
                                            <button @click="enterEditMode('GLOBAL', 'GRAPH', 'global-fav-graph-scroll')"
                                                    :disabled="!canEnterEditMode('GLOBAL', 'GRAPH')"
                                                    title="순서 편집"
                                                    class="px-2 py-0.5 text-[11px] rounded bg-gray-100 hover:bg-gray-200 disabled:opacity-50 text-gray-600 cursor-pointer">순서 편집</button>
                                        </template>
                                        <template x-if="isEditing('GLOBAL', 'GRAPH')">
                                            <div class="flex gap-1">
                                                <button @click="saveOrder()"
                                                        :disabled="favoriteEdit.saving"
                                                        class="px-2 py-0.5 text-[11px] rounded bg-blue-500 hover:bg-blue-600 disabled:opacity-50 text-white cursor-pointer">저장</button>
                                                <button @click="cancelOrder()"
                                                        :disabled="favoriteEdit.saving"
                                                        class="px-2 py-0.5 text-[11px] rounded bg-gray-100 hover:bg-gray-200 disabled:opacity-50 text-gray-600 cursor-pointer">취소</button>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div id="global-fav-graph-scroll" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                    <template x-for="card in homeSummary.enrichedFavorites.global.filter(c => c.displayMode === 'GRAPH' && !c.failed)" :key="card.indicatorCode">
                                        <div>
                                            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm relative">
                                                <!-- 해제 버튼 -->
                                                <button @click="removeDashboardFavorite('GLOBAL', card.indicatorCode)"
                                                        class="absolute top-2 right-2 text-yellow-400 hover:text-yellow-500 cursor-pointer text-lg">&#9733;</button>
                                                <!-- 표시 모드 토글 버튼 -->
                                                <button @click="attemptToggleDisplayMode(card, 'GLOBAL')"
                                                        :disabled="!!card._displayModePending"
                                                        title="지표로 보기"
                                                        class="absolute top-2 right-9 px-1.5 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 disabled:opacity-50 text-gray-600 cursor-pointer">지표</button>
                                                <div class="mb-2 pr-16">
                                                    <span class="text-sm font-semibold text-gray-700" x-text="card.countryName"></span>
                                                    <p class="text-[11px] text-gray-400 mt-0.5" x-text="card.indicatorTypeDisplayName"></p>
                                                </div>
                                                <template x-if="card.failed">
                                                    <p class="text-red-400 text-sm" x-text="globalFailureMessage(card)"></p>
                                                </template>
                                                <template x-if="!card.failed">
                                                    <div class="h-40">
                                                        <template x-if="card.history && card.history.length > 0">
                                                            <canvas x-init="$nextTick(() => renderFavoriteChart($el, card.history, card.indicatorCode, card.unit))"></canvas>
                                                        </template>
                                                        <template x-if="!card.history || card.history.length === 0">
                                                            <p class="text-gray-300 text-sm">시계열 데이터 없음</p>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template x-if="card.cycle">
                                                    <p class="text-[10px] text-gray-400 mt-2" x-text="card.cycle"></p>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- 관심 지표 — 단순 지표 영역 -->
                        <template x-if="homeSummary.enrichedFavorites?.global?.filter(c => c.displayMode !== 'GRAPH' || c.failed).length > 0">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <p class="text-sm font-semibold text-gray-600 flex items-center gap-1">
                                        <span class="text-yellow-400">&#9733;</span> 관심 지표 — 지표
                                    </p>
                                    <div class="flex gap-1">
                                        <button @click="scrollFavorites(-1, 'global-fav-indicator-scroll')"
                                                class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-500 text-sm cursor-pointer">&#9664;</button>
                                        <button @click="scrollFavorites(1, 'global-fav-indicator-scroll')"
                                                class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-500 text-sm cursor-pointer">&#9654;</button>
                                    </div>
                                </div>
                                <div id="global-fav-indicator-scroll" class="flex gap-4 overflow-x-auto pb-2 snap-x snap-mandatory" style="scrollbar-width: thin;">
                                    <template x-for="card in homeSummary.enrichedFavorites.global.filter(c => c.displayMode !== 'GRAPH' || c.failed)" :key="card.indicatorCode">
                                        <div class="snap-start flex-shrink-0 w-[280px] sm:w-[300px]">
                                            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm relative">
                                                <!-- 해제 버튼 -->
                                                <button @click="removeDashboardFavorite('GLOBAL', card.indicatorCode)"
                                                        class="absolute top-2 right-2 text-yellow-400 hover:text-yellow-500 cursor-pointer text-lg">&#9733;</button>
                                                <!-- 표시 모드 토글 버튼 -->
                                                <button @click="attemptToggleDisplayMode(card, 'GLOBAL')"
                                                        :disabled="!!card._displayModePending"
                                                        title="그래프로 보기"
                                                        class="absolute top-2 right-9 px-1.5 py-0.5 text-[10px] rounded bg-gray-100 hover:bg-gray-200 disabled:opacity-50 text-gray-600 cursor-pointer">그래프</button>
                                                <!-- 재조회 버튼: 실시간 조회 실패 시 표시 -->
                                                <template x-if="card.failed">
                                                    <button @click="refreshGlobal(card)"
                                                            :disabled="!card.refreshable || card.refreshing"
                                                            :title="card.refreshable ? '다시 조회' : '현재 재조회로 해결되지 않는 실패입니다'"
                                                            class="absolute top-2 right-[5.5rem] text-gray-500 hover:text-gray-700 disabled:text-gray-300 disabled:cursor-not-allowed cursor-pointer text-base"
                                                            :class="card.refreshing ? 'animate-spin' : ''">&#10227;</button>
                                                </template>
                                                <div class="mb-2 pr-24">
                                                    <span class="text-sm font-semibold text-gray-700" x-text="card.countryName"></span>
                                                    <p class="text-[11px] text-gray-400 mt-0.5" x-text="card.indicatorTypeDisplayName"></p>
                                                </div>
                                                <template x-if="card.failed">
                                                    <p class="text-red-400 text-sm" x-text="globalFailureMessage(card)"></p>
                                                </template>
                                                <template x-if="!card.failed && card.hasData">
                                                    <div class="flex items-end justify-between">
                                                        <p class="text-2xl font-bold font-mono-num leading-none text-gray-800">
                                                            <span x-text="card.dataValue"></span>
                                                            <span class="text-sm font-normal text-gray-400 ml-0.5" x-text="card.unit"></span>
                                                        </p>
                                                        <template x-if="card.previousDataValue">
                                                            <span class="text-xs font-mono-num"
                                                                  :class="Format.change(card.dataValue, card.previousDataValue).className">
                                                                <span x-text="Format.change(card.dataValue, card.previousDataValue).symbol"></span>
                                                                <span x-text="Format.changeRate(card.dataValue, card.previousDataValue)"></span>
                                                            </span>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template x-if="!card.failed && !card.hasData">
                                                    <p class="text-gray-300 text-sm">데이터 없음</p>
                                                </template>
                                                <template x-if="card.cycle">
                                                    <p class="text-[10px] text-gray-400 mt-2" x-text="card.cycle"></p>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
