            <!-- ========== PORTFOLIO (셸: 헤더 + 4탭 내비) ========== -->
            <!-- 탭 본문은 portfolio-holdings / portfolio-sales / portfolio-targets / portfolio-analysis partial 로 분리 (#110) -->
            <div x-show="currentPage === 'portfolio'" x-cloak>
                <!-- 헤더 -->
                <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3 pb-4 border-b border-gray-200">
                    <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1">
                        <h2 class="text-xl font-bold text-gray-800">포트폴리오</h2>
                        <template x-if="getLatestPriceCache()">
                            <span class="text-xs text-gray-400 font-mono"
                                x-text="getCacheAgoText(getLatestPriceCache()) + ' · ' + getCacheRemainingText(getLatestPriceCache())"></span>
                        </template>
                    </div>
                    <div class="flex flex-wrap items-center gap-3">
                        <!-- 마감 알림 토글 -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-500">마감 알림</span>
                            <button @click="toggleNotification()"
                                :class="auth.notificationEnabled ? 'bg-blue-600' : 'bg-gray-300'"
                                class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors">
                                <span :class="auth.notificationEnabled ? 'translate-x-5' : 'translate-x-1'"
                                    class="inline-block h-3 w-3 transform rounded-full bg-white transition-transform"></span>
                            </button>
                        </div>
                        <button @click="loadStockPrices()"
                            class="text-xs text-gray-600 border border-gray-300 px-3 py-1.5 rounded-lg hover:border-gray-500 hover:text-gray-800 transition">
                            시세 새로고침
                        </button>
                        <button @click="openAddModal()"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                            + 자산 추가
                        </button>
                    </div>
                </div>

                <!-- 탭 내비 (배지 = 건수) -->
                <div class="flex flex-wrap gap-1 border-b border-gray-200 mb-4">
                    <button @click="setActiveTab('holdings')"
                        :class="portfolio.activeTab === 'holdings' ? 'text-rose-600 border-rose-600' : 'text-gray-500 border-transparent hover:text-gray-700'"
                        class="px-4 py-2 text-sm font-medium border-b-2 transition flex items-center gap-1.5">
                        보유 자산
                        <span class="text-[10px] px-1.5 py-0.5 rounded-full"
                            :class="portfolio.activeTab === 'holdings' ? 'bg-rose-600 text-white' : 'bg-gray-200 text-gray-600'"
                            x-text="portfolio.items.length"></span>
                    </button>
                    <button @click="setActiveTab('sales')"
                        :class="portfolio.activeTab === 'sales' ? 'text-rose-600 border-rose-600' : 'text-gray-500 border-transparent hover:text-gray-700'"
                        class="px-4 py-2 text-sm font-medium border-b-2 transition flex items-center gap-1.5">
                        매도 이력
                        <span x-show="portfolio.userSales.length > 0" class="text-[10px] px-1.5 py-0.5 rounded-full"
                            :class="portfolio.activeTab === 'sales' ? 'bg-rose-600 text-white' : 'bg-gray-200 text-gray-600'"
                            x-text="portfolio.userSales.length"></span>
                    </button>
                    <button @click="setActiveTab('targets')"
                        :class="portfolio.activeTab === 'targets' ? 'text-rose-600 border-rose-600' : 'text-gray-500 border-transparent hover:text-gray-700'"
                        class="px-4 py-2 text-sm font-medium border-b-2 transition flex items-center gap-1.5">
                        목표 배분
                        <span x-show="getBandExceededCount() > 0" class="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-500 text-white"
                            x-text="getBandExceededCount()"></span>
                    </button>
                    <button @click="setActiveTab('analysis')"
                        :class="portfolio.activeTab === 'analysis' ? 'text-rose-600 border-rose-600' : 'text-gray-500 border-transparent hover:text-gray-700'"
                        class="px-4 py-2 text-sm font-medium border-b-2 transition flex items-center gap-1.5">
                        분석
                        <span x-show="getAnalysisTargets().length > 0" class="text-[10px] px-1.5 py-0.5 rounded-full"
                            :class="portfolio.activeTab === 'analysis' ? 'bg-rose-600 text-white' : 'bg-gray-200 text-gray-600'"
                            x-text="getAnalysisTargets().length"></span>
                    </button>
                </div>

                <!-- 로딩 -->
                <template x-if="portfolio.loading && portfolio.activeTab === 'holdings'">
                    <div class="flex justify-center py-12">
                        <div class="spinner"></div>
                    </div>
                </template>

                <!-- 빈 상태 (초기 로드 완료 후에만 표시) -->
                <template x-if="!portfolio.loading && portfolio._initialized && portfolio.items.length === 0">
                    <div class="bg-white rounded-xl border border-gray-200 p-12 text-center">
                        <p class="text-gray-400 text-sm mb-4">등록된 자산이 없습니다.</p>
                        <button @click="openAddModal()"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                            첫 번째 자산 추가하기
                        </button>
                    </div>
                </template>

                <!-- 키워드 등록 모달 (#110) — 등록만 담당, 기사 열람·삭제는 키워드 메뉴 -->
                <template x-if="portfolio.keywordModal.show">
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div class="absolute inset-0 bg-black bg-opacity-40" @click="closeKeywordModal()"></div>
                        <div class="relative bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-base font-bold text-gray-800">키워드 등록</h3>
                                <button @click="closeKeywordModal()"
                                    class="text-gray-400 hover:text-gray-600 transition">&#10005;</button>
                            </div>
                            <div class="bg-blue-50 rounded-lg px-3 py-2.5 mb-4">
                                <p class="text-xs text-blue-700 leading-relaxed">
                                    수집된 기사는 포트폴리오가 아니라 <strong>키워드</strong> 메뉴에서 확인합니다.
                                    등록 후 수집 주기에 맞춰 자동으로 쌓입니다.
                                </p>
                            </div>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">키워드</label>
                                    <div class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-700"
                                        x-text="portfolio.keywordModal.item?.itemName"></div>
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">분류</label>
                                    <div class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-700"
                                        x-text="getKeywordRegion(portfolio.keywordModal.item)"></div>
                                </div>
                            </div>
                            <div class="flex justify-end gap-2 mt-6">
                                <button @click="closeKeywordModal()"
                                    class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition">취소</button>
                                <button @click="submitKeyword()"
                                    :disabled="portfolio.keywordModal.saving"
                                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition disabled:opacity-50"
                                    x-text="portfolio.keywordModal.saving ? '등록 중…' : '키워드 등록'"></button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 목표 자산 배분 설정 모달 -->
                <template x-if="portfolio.allocationTargetModal.show">
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div class="absolute inset-0 bg-black bg-opacity-40" @click="closeAllocationTargetModal()"></div>
                        <div class="relative bg-white rounded-xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-base font-bold text-gray-800">목표 자산 배분 설정</h3>
                                <button @click="closeAllocationTargetModal()"
                                    class="text-gray-400 hover:text-gray-600 transition">&#10005;</button>
                            </div>
                            <div class="space-y-4">
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs text-gray-500 mb-1">안전자산 목표 (%)</label>
                                        <input type="number" min="0" max="100" step="0.1"
                                            x-model="portfolio.allocationTargetModal.form.safeRatio"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"
                                            placeholder="30">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-500 mb-1">투자자산 목표 (%) — 자동</label>
                                        <div class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-600"
                                            x-text="getAllocationInvestRatio() !== null ? getAllocationInvestRatio() : '-'"></div>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">허용밴드 (±%p)</label>
                                    <input type="number" min="0" max="20" step="0.5"
                                        x-model="portfolio.allocationTargetModal.form.bandPctPoint"
                                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                                    <p class="text-xs text-gray-400 mt-1">편차가 밴드를 넘으면 경고로 강조합니다. (기본 5)</p>
                                </div>
                                <div>
                                    <div class="flex items-center justify-between mb-1">
                                        <label class="text-xs text-gray-500">투자자산 내부 목표 (%) — 선택</label>
                                        <span class="text-xs"
                                            :class="getAllocationAssetSum() === 0 || Math.abs(getAllocationAssetSum() - 100) < 0.001 ? 'text-gray-400' : 'text-red-500'"
                                            x-text="'합계 ' + getAllocationAssetSum() + '%'"></span>
                                    </div>
                                    <div class="space-y-2">
                                        <template x-for="row in portfolio.allocationTargetModal.form.assets" :key="row.assetType">
                                            <div class="flex items-center gap-2">
                                                <span class="text-xs text-gray-600 w-20 shrink-0" x-text="row.label"></span>
                                                <input type="number" min="0" max="100" step="0.1" x-model="row.ratio"
                                                    class="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
                                                    placeholder="0">
                                            </div>
                                        </template>
                                    </div>
                                    <p class="text-xs text-gray-400 mt-1">
                                        입력한 자산군 비율의 합이 100이어야 합니다. 모두 비우면 상위 비율만 관리합니다.
                                        암호화폐는 배분 대상에서 제외됩니다.
                                    </p>
                                </div>
                            </div>
                            <div class="flex justify-end gap-2 mt-6">
                                <button @click="closeAllocationTargetModal()"
                                    class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition">취소</button>
                                <button @click="submitAllocationTarget()"
                                    :disabled="portfolio.allocationTargetModal.saving"
                                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition disabled:opacity-50"
                                    x-text="portfolio.allocationTargetModal.saving ? '저장 중…' : '저장'"></button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
