            <!-- 자산 수정 모달 -->

                                x-text="getAssetTypeLabel(portfolio.editingItem.assetType)"></span>
                        </p>
                    </template>

                    <template x-if="portfolio.editingItem">
                        <div class="space-y-3">

                            <!-- ===== 주식 수정 ===== -->
                            <template x-if="portfolio.editingItem.assetType === 'STOCK'">
                                <div>
                                    <div class="mb-3">
                                        <label class="block text-sm text-gray-600 mb-1">종목</label>
                                        <input type="text" disabled

                                            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-gray-50 text-gray-500 cursor-not-allowed">
                                    </div>

                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">유형</label>
                                        <select x-model="portfolio.editForm.subType"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="INDIVIDUAL">개별주식</option>
                                            <option value="ETF">ETF</option>
                                        </select>
                                    </div>
                                    <div class="grid grid-cols-3 gap-2">
                                        <div>
                                            <label class="block text-sm text-gray-600 mb-1">매수 수량 *</label>
                                            <input type="number" x-model="portfolio.editForm.quantity" placeholder="0"

                                        </div>
                                        <div>
                                            <label class="block text-sm text-gray-600 mb-1">
                                                매수가 *
                                                <span x-show="portfolio.editForm.priceCurrency && portfolio.editForm.priceCurrency !== 'KRW'"
                                                      class="text-blue-500 font-medium"
                                                      x-text="'(' + portfolio.editForm.priceCurrency + ')'"></span>
                                            </label>
                                            <input type="number" x-model="portfolio.editForm.purchasePrice"
                                                :step="portfolio.editForm.priceCurrency && portfolio.editForm.priceCurrency !== 'KRW' ? '0.01' : '1'"
                                                :placeholder="portfolio.editForm.priceCurrency && portfolio.editForm.priceCurrency !== 'KRW' ? '0.00' : '0'"

                                        </div>
                                        <div>
                                            <label class="block text-sm text-gray-600 mb-1">배당률(%)</label>

                                        <div x-show="portfolio.editForm.priceCurrency && portfolio.editForm.priceCurrency !== 'KRW'" class="col-span-3">

                                            <input type="number" x-model="portfolio.editForm.investedAmountKrw" placeholder="실제 투자한 원화 금액"
                                                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        </div>

                                        <!-- 원화 연결 -->
                                        <div class="col-span-3" x-show="getCashItems().length > 0">
                                            <label class="block text-sm text-gray-600 mb-1">연결 현금 자산</label>
                                            <select x-model="portfolio.editForm.cashItemId"
                                                x-effect="if(portfolio.editForm.cashItemId) { $el.value = portfolio.editForm.cashItemId }"
                                                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                                <option value="">연결 안 함</option>
                                                <template x-for="cash in getCashItems()" :key="cash.id">
                                                    <option :value="String(cash.id)" x-text="cash.itemName + ' (' + Number(cash.investedAmount).toLocaleString() + '원)'"></option>
                                                </template>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- ===== 채권 수정 ===== -->
                            <template x-if="portfolio.editingItem.assetType === 'BOND'">
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">유형</label>
                                        <select x-model="portfolio.editForm.subType"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="GOVERNMENT">국채</option>
                                            <option value="CORPORATE">회사채</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">만기일</label>
                                        <input type="date" x-model="portfolio.editForm.maturityDate"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-sm text-gray-600 mb-1">표면금리(%)</label>
                                            <input type="number" step="0.01" x-model="portfolio.editForm.couponRate" placeholder="0.00"
                                                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        </div>
                                        <div>
                                            <label class="block text-sm text-gray-600 mb-1">신용등급</label>
                                            <input type="text" x-model="portfolio.editForm.creditRating" placeholder="AAA"
                                                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- ===== 부동산 수정 ===== -->
                            <template x-if="portfolio.editingItem.assetType === 'REAL_ESTATE'">
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">유형</label>
                                        <select x-model="portfolio.editForm.subType"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="APARTMENT">아파트</option>
                                            <option value="OFFICETEL">오피스텔</option>
                                            <option value="LAND">토지</option>
                                            <option value="COMMERCIAL">상가</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">주소</label>
                                        <input type="text" x-model="portfolio.editForm.address" placeholder="주소 입력"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">면적 (m²)</label>
                                        <input type="number" step="0.01" x-model="portfolio.editForm.area" placeholder="0.00"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                </div>
                            </template>

                            <!-- ===== 펀드 수정 ===== -->
                            <template x-if="portfolio.editingItem.assetType === 'FUND'">
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">유형</label>
                                        <select x-model="portfolio.editForm.subType"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="EQUITY_FUND">주식형</option>
                                            <option value="BOND_FUND">채권형</option>
                                            <option value="MIXED_FUND">혼합형</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">운용보수(%)</label>
                                        <input type="number" step="0.01" x-model="portfolio.editForm.managementFee" placeholder="0.00"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <!-- 자동납입 설정 -->
                                    <div class="flex gap-3">
                                        <div class="w-2/3">
                                            <label class="block text-sm text-gray-600 mb-1">월 납입액</label>
                                            <input type="number" x-model="portfolio.editForm.monthlyDepositAmount"
                                                placeholder="월 자동납입 금액" min="0"
                                                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        </div>
                                        <div class="w-1/3">
                                            <label class="block text-sm text-gray-600 mb-1">납입일</label>
                                            <input type="number" x-model="portfolio.editForm.depositDay"
                                                placeholder="일" min="1" max="31"
                                                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- ===== 현금성 자산 수정 필드 ===== -->
                            <template x-if="portfolio.editingItem.assetType === 'CASH'">
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">유형</label>
                                        <select x-model="portfolio.editForm.cashType" disabled
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-100 text-gray-500 cursor-not-allowed">
                                            <option value="DEPOSIT">예금</option>
                                            <option value="SAVINGS">적금</option>
                                            <option value="CMA">CMA</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">이자율 (%)</label>
                                        <input type="number" step="0.01" min="0" max="100" x-model="portfolio.editForm.interestRate" placeholder="3.50"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div x-show="portfolio.editForm.cashType !== 'CMA'">
                                        <label class="block text-sm text-gray-600 mb-1">시작일</label>
                                        <input type="date" x-model="portfolio.editForm.startDate"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div x-show="portfolio.editForm.cashType !== 'CMA'">
                                        <label class="block text-sm text-gray-600 mb-1">만기일</label>
                                        <input type="date" x-model="portfolio.editForm.maturityDate"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div x-show="portfolio.editForm.cashType !== 'CMA'">
                                        <label class="block text-sm text-gray-600 mb-1">과세 유형</label>
                                        <select x-model="portfolio.editForm.taxType"
                                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="GENERAL">일반과세 (15.4%)</option>
                                            <option value="TAX_FREE">비과세</option>
                                            <option value="TAX_FAVORED">세금우대 (9.5%)</option>
                                        </select>
                                    </div>
                                    <!-- 자동납입 설정 -->
                                    <div class="flex gap-3">
                                        <div class="w-2/3">
                                            <label class="block text-sm text-gray-600 mb-1">월 납입액</label>
                                            <input type="number" x-model="portfolio.editForm.monthlyDepositAmount"
                                                placeholder="월 자동납입 금액" min="0"
                                                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        </div>
                                        <div class="w-1/3">
                                            <label class="block text-sm text-gray-600 mb-1">납입일</label>
                                            <input type="number" x-model="portfolio.editForm.depositDay"
                                                placeholder="일" min="1" max="31"
                                                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- ===== 공통 필드 ===== -->
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">항목명 *</label>
                                <input type="text" x-model="portfolio.editForm.itemName" placeholder="항목명"
                                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <template x-if="portfolio.editingItem.assetType !== 'STOCK'">
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">투자 금액 (원) *</label>
                                    <input type="number" x-model="portfolio.editForm.investedAmount" placeholder="0"
                                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </template>
                            <template x-if="portfolio.editingItem.assetType === 'GOLD'">
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">보유 중량 (g)</label>
                                    <input type="number" min="0" step="0.001" x-model="portfolio.editForm.quantityGrams"
                                        placeholder="예: 37.5 (한 돈 = 3.75g)"
                                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <p class="text-xs text-gray-400 mt-1">입력하면 KRX 금시세로 평가액을 계산합니다. 비우면 투자 금액 그대로 평가합니다.</p>
                                </div>
                            </template>
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">메모</label>
                                <input type="text" x-model="portfolio.editForm.memo" placeholder="메모 (선택)"
                                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>

                            <!-- 버튼 -->
                            <div class="flex justify-end gap-2 mt-5">
                                <button @click="portfolio.showEditModal = false; portfolio.editingItem = null"
                                    class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">취소</button>
                                <button @click="submitEditItem()"
                                    class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">수정</button>
                            </div>
                        </div>
                    </template>

                </div>
            </div>

            <!-- 삭제 확인 모달 (원화 복원 옵션) -->
            <div x-show="portfolio.deleteConfirm.show" x-cloak
                class="modal-backdrop fixed inset-0 bg-black/30 flex items-center justify-center z-50">
                <div class="bg-white rounded-xl p-6 w-[calc(100vw-1.5rem)] sm:w-[400px] shadow-xl"
                    @click.outside="cancelDelete()">
                    <h3 class="text-lg font-bold text-gray-800 mb-2">자산 삭제</h3>
                    <p class="text-sm text-gray-600 mb-4">
                        <span class="font-medium" x-text="portfolio.deleteConfirm.itemName"></span> 항목을 삭제하시겠습니까?
                        <br><span class="text-xs text-gray-400">관련 뉴스도 함께 삭제됩니다.</span>
                    </p>

                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" x-model="portfolio.deleteConfirm.restoreCash"
                                class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm text-blue-800">연결된 원화에 금액 복원</span>
                        </label>
                        <div x-show="portfolio.deleteConfirm.restoreCash" class="mt-2">
                            <label class="block text-xs text-blue-600 mb-1">복원 금액 (원)</label>
                            <input type="number" x-model="portfolio.deleteConfirm.restoreAmount"
                                class="w-full border border-blue-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="flex justify-end gap-2">
                        <button @click="cancelDelete()"
                            class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">취소</button>
                        <button @click="confirmDelete()"
                            class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition">삭제</button>
                    </div>
                </div>
            </div>

            <!-- 추가 매수 모달 -->
