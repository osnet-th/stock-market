# 이 워크플로는 더 이상 배포하지 않는다.
#
# 내부 서버는 인바운드 포트 개방이 없어 GitHub 클라우드 러너에서 SSH 로 접속할 수 없다.
# 기존에 있던 appleboy/ssh-action 배포 단계는 구조상 성공할 수 없었으므로 제거했다.
# 배포는 Cloudflare Tunnel 을 거치는 배포 훅 API 로 트리거한다(scripts/deploy-hook-listener.py).
#
# 여기서는 main 에 빌드가 깨진 코드가 올라가는 것을 막는 검증만 수행한다.
name: Build check

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: chmod +x ./gradlew

      - run: ./gradlew clean build -x test
